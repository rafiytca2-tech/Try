  --res:#4fa3ff; --com:#ff6a5a; --off:#ffb13a; --ind:#b68cff;
  --f-disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-cond:"Nunito","Segoe UI","Roboto",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI","Roboto",system-ui,sans-serif;
  --outline:0 2px 0 rgba(9,38,92,.85),0 0 3px rgba(9,38,92,.7);
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:#0b1a33;color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:16px;line-height:1.35;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
body.big{font-size:18px}
/* High contrast: solid panels, darker card text and outlined labels. */
body.hc{--glass:rgba(6,20,52,.96);--glass-strong:rgba(4,14,40,.98);--muted:#ffffff;--card-muted:#1d3159;--line:#ffffff;--danger:#ff9d4d;--moving:#ffe066}
body.hc .glass,body.hc .card,body.hc .btn{border-width:3px}
body.hc .dlabel,body.hc .tlabel{background:#0b2350;text-shadow:none}
body.hc .pop{text-shadow:0 0 3px #000,0 0 6px #000,0 2px 0 #000}
#stage{position:fixed;inset:0;overflow:hidden;background:#0b1a33;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx,#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glass{background:var(--glass);border:2px solid var(--line);box-shadow:0 3px 0 rgba(6,24,60,.35)}
button{font:inherit;color:inherit}
svg{flex:none}

/* ---------- Buttons: rounded, glossy, with a pressed-down edge ---------- */
.btn{
  position:relative;min-height:50px;padding:9px 18px;border-radius:16px;cursor:pointer;font:400 20px/1.1 var(--f-disp);letter-spacing:.02em;
  color:#fff;text-shadow:0 2px 0 rgba(10,40,100,.55);
  background:linear-gradient(var(--blue-a),var(--blue-b));border:2px solid var(--blue-edge);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.12),0 4px 0 var(--blue-edge);
  margin-bottom:4px;
}
.btn.primary{background:linear-gradient(var(--yellow-a),var(--yellow-b));border-color:var(--yellow-edge);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.1),0 4px 0 var(--yellow-edge);text-shadow:0 2px 0 var(--yellow-edge),0 0 3px var(--yellow-edge)}
.btn.go{background:linear-gradient(var(--green-a),var(--green-b));border-color:var(--green-edge);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.1),0 4px 0 var(--green-edge);text-shadow:0 2px 0 var(--green-edge)}
.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);box-shadow:none;margin-bottom:0}
.btn.small{min-height:38px;padding:5px 14px;font-size:17px;border-radius:12px}
.btn.danger{background:linear-gradient(#ff8a7a,#e8402f);border-color:#9a1f14;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 #9a1f14;text-shadow:0 2px 0 #9a1f14}
.btn.ghost.danger{background:transparent;border-color:rgba(255,160,150,.6);color:#ffd0c8;box-shadow:none}
.btn:disabled{filter:grayscale(.7) brightness(.92);opacity:.7;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 1px 0 var(--blue-edge)}
.btn.primary:active:not(:disabled){box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 1px 0 var(--yellow-edge)}
.btn.go:active:not(:disabled){box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 var(--green-edge)}
.btn:focus-visible,.icon-btn:focus-visible,.switch input:focus-visible+span,select:focus-visible,.card:focus-visible,.tab:focus-visible,.nav-btn:focus-visible,.side-btn:focus-visible,.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.icon-btn{
  pointer-events:auto;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;cursor:pointer;padding:0;position:relative;
  color:#fff;font:400 18px var(--f-disp);background:linear-gradient(var(--blue-a),var(--blue-b));border:2px solid var(--blue-edge);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 3px 0 var(--blue-edge);
}
.icon-btn svg{width:26px;height:26px}
.badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:11px;background:var(--red);border:2px solid #fff;color:#fff;font:400 13px/18px var(--f-disp);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.coin{color:var(--coin)}
.go svg,.stats svg,.sub svg,.card svg,.unlocks svg{width:18px;height:18px;vertical-align:-4px}
.prestige{color:var(--prestige)}

/* ---------- Construction HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-body);text-shadow:var(--outline)}
#pauseBtn{position:absolute;top:calc(var(--top) + 12px);right:14px}
.stab{
  position:absolute;left:14px;top:calc(var(--top) + 12px);display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:999px;font:800 14px var(--f-body);letter-spacing:.06em;text-transform:uppercase;
}
.stab .segs{display:flex;gap:3px}
.stab .segs i{width:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.22)}
.stab[data-level="0"]{--c:var(--stable)}
.stab[data-level="1"]{--c:var(--moving)}
.stab[data-level="2"]{--c:var(--danger)}
.stab[data-level="3"]{--c:var(--critical);animation:pulse .5s ease-in-out infinite alternate}
.stab .ico,.stab .txt{color:var(--c)}
.stab[data-level="0"] .segs i:nth-child(-n+1),
.stab[data-level="1"] .segs i:nth-child(-n+2),
.stab[data-level="2"] .segs i:nth-child(-n+3),
.stab[data-level="3"] .segs i{background:var(--c)}
@keyframes pulse{to{box-shadow:0 0 0 4px rgba(255,74,61,.5)}}
.mult{
  position:absolute;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:112px;box-sizing:border-box;padding:6px 14px 9px;border-radius:16px;
}
.mult b{font:400 32px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.mult span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mult .bar{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.mult .bar i{display:block;height:100%;width:0;background:var(--accent)}
.mult.warn b,.mult.warn span{color:var(--critical)}
.mult.warn .bar i{background:var(--critical)}
.mult.power b{color:var(--accent)}
.bpname{position:absolute;left:50%;top:calc(var(--top) + 70px);transform:translateX(-50%);font:400 16px var(--f-disp);letter-spacing:.04em;color:#fff;white-space:nowrap}
.gauge{position:absolute;left:14px;bottom:calc(var(--bot) + 16px);display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge-badge{
  min-width:42px;box-sizing:border-box;text-align:center;padding:3px 8px;border-radius:10px;font:400 24px/1.05 var(--f-disp);
  color:#fff;background:linear-gradient(var(--green-a),var(--green-b));border:2px solid var(--green-edge);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--green-edge)
}
.gauge-badge small{font-size:15px;opacity:.85}
.gauge-bar{position:relative;width:16px;height:112px;border-radius:8px;background:rgba(10,32,80,.8);border:2px solid #fff}
.gauge-bar i{position:absolute;left:2px;right:2px;bottom:2px;height:0;border-radius:5px;background-image:repeating-linear-gradient(to top,var(--c,#5fdc3c) 0 6px,transparent 6px 8px)}
.gauge-label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;max-width:110px;text-align:center}
.hud-br{position:absolute;right:14px;bottom:calc(var(--bot) + 16px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hud-pop{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;font:400 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.hud-pop svg{width:24px;height:18px}
.lives{display:flex;gap:6px}
.life{width:24px;height:16px;color:var(--accent);filter:drop-shadow(0 2px 0 rgba(9,38,92,.8))}
.life.lost{color:rgba(255,255,255,.25)}
.combo{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.combo span{font:400 18px var(--f-disp);letter-spacing:.03em;color:var(--combo)}
.combo-bar{width:96px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.combo-bar i{display:block;height:100%;margin-left:auto;background:var(--combo)}
.coach{
  position:absolute;left:50%;top:calc(var(--top) + 98px);transform:translateX(-50%);
  width:max-content;max-width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:10px 14px;border-radius:16px;
  background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);font:800 15px/1.35 var(--f-body);text-align:center;text-shadow:none;pointer-events:none;box-shadow:0 4px 0 rgba(10,40,100,.35)
}
.coach b{color:#e07b00;font-weight:900}
.banner{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;pointer-events:none;font-family:var(--f-disp)}
.banner b{font-size:44px;font-weight:400;letter-spacing:.02em;color:var(--accent);line-height:1;text-shadow:0 4px 0 #a55300,0 0 4px #a55300,0 8px 16px rgba(0,0,0,.35)}
.banner span{font-size:22px;color:#fff;text-shadow:var(--outline)}
.banner.show{animation:bannerIn 1.9s ease-out forwards}
@keyframes bannerIn{0%{opacity:0;transform:translateY(10px) scale(.8)}12%{opacity:1;transform:scale(1.06)}20%{transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.pop{
  position:absolute;left:0;top:0;white-space:nowrap;text-align:center;will-change:transform,opacity;
  font:400 28px/1 var(--f-disp);letter-spacing:.02em;text-shadow:0 3px 0 rgba(9,38,92,.8),0 0 4px rgba(9,38,92,.7);
}
.pop.perfect{color:var(--accent);font-size:36px}
.pop.excellent{color:#8ff0c2}
.pop.great{color:#8fd3ff}
.pop.good{color:var(--ink)}
.pop.rough{color:#ffd08a}
.pop.dangerous{color:var(--danger)}
.pop.miss{color:var(--critical)}
.pop.combo{color:var(--combo);font-size:22px}
.pop.pts{font-size:22px;color:var(--ink)}
.pop.info{font:800 16px var(--f-body);color:#fff}
.pop.bonus{font-size:24px;color:var(--stable)}
.pop.coinpop{font-size:26px;color:var(--coin)}

/* ---------- City hub ---------- */
.hub{position:absolute;inset:0;pointer-events:none}
.hub-top{position:absolute;left:10px;right:10px;top:calc(var(--top) + 10px);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{pointer-events:auto;position:relative;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 34px;margin-left:10px;border-radius:999px;font:400 19px var(--f-disp);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:var(--outline)}
.chip>svg{position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:38px;height:38px;filter:drop-shadow(0 2px 0 rgba(9,38,92,.6))}
.chip .plus{width:26px;height:26px;margin-right:-8px;border-radius:8px;border:2px solid var(--green-edge);background:linear-gradient(var(--green-a),var(--green-b));color:#fff;font:400 20px/1 var(--f-disp);padding:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 0 var(--green-edge);text-shadow:0 1px 0 var(--green-edge)}
.lvl{gap:8px;padding:0 12px 0 44px;cursor:pointer;margin-left:6px}
.lvl .ring{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:46px;height:46px}
.lvl .ring svg{position:absolute;inset:0;width:46px;height:46px;filter:drop-shadow(0 2px 0 rgba(9,38,92,.6))}
.lvl .ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 19px var(--f-disp);color:#fff;text-shadow:var(--outline)}
.lvl .lbar{display:flex;flex-direction:column;gap:2px;font:800 11px var(--f-body);letter-spacing:.04em;color:#fff;line-height:1}
.lvl .lbar i{display:block;width:84px;height:10px;border-radius:5px;background:rgba(0,20,60,.55);border:1.5px solid rgba(255,255,255,.7);overflow:hidden;box-sizing:border-box}
.lvl .lbar i::after{content:"";display:block;height:100%;width:var(--p,0%);background:linear-gradient(#ffe45a,#ffb416)}
.collect{
  pointer-events:auto;position:absolute;left:50%;top:calc(var(--top) + 96px);transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;cursor:pointer;
  font:400 20px var(--f-disp);color:#fff;text-shadow:0 2px 0 var(--yellow-edge);background:linear-gradient(var(--yellow-a),var(--yellow-b));border:2px solid var(--yellow-edge);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 4px 0 var(--yellow-edge),0 8px 20px rgba(0,0,0,.3);animation:bob 1.6s ease-in-out infinite;
}
.collect svg{width:24px;height:24px}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.compass{pointer-events:auto;position:absolute;right:14px;top:calc(var(--top) + 100px);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff}
.compass svg{width:24px;height:24px;transition:none}
.compass:not(.turned){opacity:.75}
.rail{position:absolute;right:12px;top:calc(var(--top) + 154px);display:flex;flex-direction:column;gap:14px}
.rail .icon-btn{width:50px;height:50px}
.rail .icon-btn.on{background:linear-gradient(var(--yellow-a),var(--yellow-b));border-color:var(--yellow-edge);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 3px 0 var(--yellow-edge)}
.rail small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:400 12px var(--f-disp);letter-spacing:.02em;color:#fff;text-shadow:var(--outline);white-space:nowrap}
/* Bottom navigation, like the store tabs of a phone game. */
.navbar{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(var(--bot) + 8px);
  background:linear-gradient(rgba(34,92,196,.0),rgba(18,56,130,.55) 30%,rgba(14,44,104,.85))}
.nav-btn{position:relative;flex:1;max-width:94px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border-radius:16px;cursor:pointer;
  color:#fff;font:400 14px var(--f-disp);letter-spacing:.02em;text-shadow:var(--outline);background:linear-gradient(var(--blue-a),var(--blue-b));border:2px solid var(--blue-edge);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 3px 0 var(--blue-edge)}
.nav-btn svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(9,38,92,.45))}
.nav-btn.hot{background:linear-gradient(var(--yellow-a),var(--yellow-b));border-color:var(--yellow-edge);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 3px 0 var(--yellow-edge);text-shadow:0 2px 0 var(--yellow-edge)}
.nav-btn:active{transform:translateY(2px)}
.hub-bottom{position:absolute;left:10px;right:10px;bottom:calc(var(--bot) + 88px);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.demand{pointer-events:auto;display:flex;align-items:flex-end;gap:10px;padding:7px 12px;border-radius:16px;font:400 13px var(--f-disp);letter-spacing:.02em;text-shadow:var(--outline)}
.dbar{display:flex;flex-direction:column;align-items:center;gap:3px}
.dbar .col{position:relative;width:14px;height:38px;border-radius:5px;background:rgba(0,20,60,.5);border:1.5px solid rgba(255,255,255,.55);overflow:hidden;box-sizing:border-box}
.dbar .col::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.5)}
.dbar .col i{position:absolute;left:0;right:0;background:var(--c)}
.happy{display:flex;flex-direction:column;gap:1px;align-items:flex-start;padding-left:8px;border-left:2px solid rgba(255,255,255,.25);color:var(--muted);font:800 12px var(--f-body);text-shadow:none}
.happy b{font:400 19px var(--f-disp);color:#fff;text-shadow:var(--outline)}
.happy b.warn{color:var(--moving)}
.happy b.bad{color:var(--danger)}
.demand{flex-wrap:wrap;cursor:pointer}
.status{display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.spill{pointer-events:auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;cursor:pointer;color:#fff;font:400 15px var(--f-disp);letter-spacing:.02em;white-space:nowrap;text-shadow:var(--outline)}
.spill i{font-style:normal;font-size:17px}
.spill small{font:800 13px var(--f-body);color:var(--muted);text-shadow:none}
.spill.bonus small{color:var(--stable)}
.ovkey{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:14px;font:800 13px var(--f-body);color:var(--muted)}
.ovkey b{color:#fff;font:400 15px var(--f-disp)}
.ovkey i{display:block;width:70px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--b),var(--c))}
.goal{pointer-events:auto;max-width:min(440px,calc(100% - 70px));padding:9px 14px;border-radius:16px;font:800 15px/1.35 var(--f-body);cursor:pointer;
  background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);box-shadow:0 3px 0 rgba(10,40,100,.35)}
.goal b{color:#e07b00;font-weight:900}
/* Labels that float over the 3D city */
.dlabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;padding:5px 12px 6px;border-radius:14px;
  font:400 16px/1.1 var(--f-disp);letter-spacing:.02em;color:#fff;text-shadow:var(--outline);background:linear-gradient(rgba(70,150,250,.92),rgba(34,96,210,.92));border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(9,38,92,.6)}
.dlabel small{display:flex;align-items:center;justify-content:center;gap:4px;font:400 14px var(--f-disp);color:var(--coin)}
.dlabel small svg{width:15px;height:15px}
.dlabel.locked{background:linear-gradient(rgba(60,78,110,.9),rgba(36,50,80,.9))}
.dlabel.star small{color:#fff}
.tlabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;padding:3px 9px;border-radius:10px;background:rgba(16,45,104,.88);border:2px solid rgba(255,255,255,.7);font:400 14px var(--f-disp);color:#fff}
.tlabel.warn{color:var(--moving)}
.buildhere{position:absolute;left:0;top:0;margin-top:-44px;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.buildhere b{padding:7px 14px;border-radius:14px;background:linear-gradient(var(--yellow-a),var(--yellow-b));border:2px solid var(--yellow-edge);color:#fff;font:400 19px var(--f-disp);text-shadow:0 2px 0 var(--yellow-edge);box-shadow:0 4px 0 var(--yellow-edge);white-space:nowrap;animation:hop 1.1s ease-in-out infinite}
.buildhere i{width:0;height:0;border:9px solid transparent;border-top:11px solid var(--yellow-edge);margin-top:-1px}
.buildhere svg{width:40px;height:40px;margin:-6px 0 0 36px;animation:tapHand 1.1s ease-in-out infinite;filter:drop-shadow(0 2px 0 rgba(9,38,92,.5))}
@keyframes hop{50%{transform:translateY(-5px)}}
@keyframes tapHand{50%{transform:translate(-4px,-6px) rotate(-8deg)}}

/* ---------- Photo mode ---------- */
.photo{position:absolute;inset:0;pointer-events:none}
.photo button{pointer-events:auto}
.photo .ptop,.photo .pbar,.photo .pshoot,.photo .phint{transition:opacity .25s}
.photo.bare .ptop,.photo.bare .pbar,.photo.bare .pshoot,.photo.bare .phint{opacity:0;pointer-events:none}
.photo.bare button{pointer-events:none}
.ptop{position:absolute;left:12px;top:calc(var(--top) + 10px);display:flex;align-items:center;gap:10px}
.ptitle{font:400 22px var(--f-disp);letter-spacing:.02em;text-shadow:var(--outline)}
.phint{position:absolute;left:12px;right:12px;top:calc(var(--top) + 66px);margin:0;text-align:center;font:800 13px var(--f-body);color:#fff;text-shadow:var(--outline)}
.pbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 112px);display:flex;gap:5px;padding:6px;border-radius:18px;max-width:calc(100% - 24px);box-sizing:border-box}
.pbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;min-height:50px;padding:5px 8px;border-radius:13px;background:linear-gradient(var(--blue-a),var(--blue-b));border:2px solid var(--blue-edge);color:#fff;cursor:pointer;box-sizing:border-box}
.pbtn small{font:800 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pbtn b{font:400 16px var(--f-disp);white-space:nowrap;text-shadow:var(--outline)}
.ghostbtn{visibility:hidden}
.pshoot{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 26px);display:flex;align-items:center;gap:18px}
.shutter{width:74px;height:74px;border-radius:50%;border:6px solid #fff;background:radial-gradient(#ffe45a,#ffb416);cursor:pointer;box-shadow:0 4px 0 rgba(9,38,92,.6),0 4px 20px rgba(0,0,0,.4)}
.shutter:active{transform:scale(.94)}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
.flash.go{animation:flash .45s ease-out}
.fade{position:absolute;inset:0;background:#081733;pointer-events:none;opacity:0;transition:opacity .45s}
.fade.in{opacity:1;pointer-events:auto}
.fade.out{opacity:0;transition-duration:1.1s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@media (max-width:420px){.pbtn{min-width:0;flex:1;padding:5px 4px}.pbtn b{font-size:14px}.pbtn small{font-size:10px}}

/* ---------- Screens, panels, sheets ---------- */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow-y:auto;cursor:default;
  padding:16px;padding-block:calc(var(--top) + 16px) calc(var(--bot) + 16px);box-sizing:border-box;
  background:linear-gradient(to top,rgba(8,26,66,.8),rgba(8,26,66,0) 62%);
}
.screen.center{justify-content:center;background:rgba(8,26,66,.55)}
.panel{
  width:100%;max-width:460px;box-sizing:border-box;padding:18px;border-radius:24px;
  background:linear-gradient(var(--panel-a),var(--panel-b));border:3px solid var(--rim);
  box-shadow:0 0 0 3px var(--edge),inset 0 2px 0 rgba(255,255,255,.35),0 14px 36px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px;
}
.eyebrow{margin:0;font:900 13px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-shadow:var(--outline)}
h1,h2,h3{text-shadow:var(--outline)}
h2{margin:0;font:400 28px/1.05 var(--f-disp);letter-spacing:.01em;text-wrap:balance}
h3{margin:4px 0 0;font:400 19px var(--f-disp);letter-spacing:.02em}
.lede{margin:0;color:#fff;max-width:42ch;font-weight:700}
.lede b{color:var(--accent);font-weight:900}
.btns{display:flex;flex-direction:column;gap:10px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row.three{grid-template-columns:1fr 1fr 1fr}
.best{margin:0;font:800 14px var(--f-body);color:#fff;text-shadow:var(--outline)}
.scrim{position:absolute;inset:0;background:rgba(6,20,52,.5);cursor:default}
.sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:540px;max-height:82%;overflow-y:auto;box-sizing:border-box;cursor:default;
  background:linear-gradient(var(--panel-a),var(--panel-b) 180px);border:3px solid var(--rim);border-bottom:0;border-radius:26px 26px 0 0;
  box-shadow:0 0 0 3px var(--edge),inset 0 2px 0 rgba(255,255,255,.35),0 -10px 30px rgba(0,0,0,.35);
  padding:14px;padding-bottom:calc(var(--bot) + 18px);display:flex;flex-direction:column;gap:12px;
}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;padding-block:calc(var(--top) + 12px) calc(var(--bot) + 12px);box-sizing:border-box;background:rgba(6,20,52,.6)}
.modal .panel{max-height:100%;overflow-y:auto}
.panel>*,.sheet>*{flex-shrink:0}
.modal .panel.wide{max-width:560px}
/* Header bar: a yellow back button and a centred title */
.head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:-4px -4px 0}
.head>div{text-align:center;min-width:0}
.head .x{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;
  background:linear-gradient(var(--yellow-a),var(--yellow-b));border:2px solid var(--yellow-edge);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 3px 0 var(--yellow-edge)}
.head .x svg{width:26px;height:26px}
.head .hx{display:grid;place-items:center}
.sub{margin:2px 0 0;color:var(--muted);font:700 14px/1.35 var(--f-body)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);font:800 13px var(--f-body);color:#fff}
.pills span.good{background:rgba(70,220,120,.28);border-color:rgba(140,255,180,.6)}
.pills span.bad{background:rgba(255,90,70,.3);border-color:rgba(255,160,150,.6)}
.pills span.gold{background:rgba(255,201,40,.3);border-color:rgba(255,225,120,.7)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px 5px;border-radius:14px;cursor:pointer;
  background:linear-gradient(#2f6fd8,#1f55b8);border:2px solid var(--edge);color:#fff;font:400 14px var(--f-disp);letter-spacing:.02em;text-shadow:var(--outline);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 0 var(--edge)}
.tab svg{width:28px;height:28px}
.tab[aria-selected="true"]{background:linear-gradient(var(--yellow-a),var(--yellow-b));border-color:var(--yellow-edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 var(--yellow-edge);text-shadow:0 2px 0 var(--yellow-edge)}
.cards{display:grid;gap:10px}
.card{
  position:relative;display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;min-height:64px;padding:10px 12px;box-sizing:border-box;
  border-radius:16px;cursor:pointer;color:var(--card-ink);background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);box-shadow:0 3px 0 rgba(10,40,100,.35);font-weight:800
}
.card .sw{width:14px;height:42px;border-radius:5px;background:var(--c);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 0 0 1.5px rgba(0,0,0,.15)}
.card b{display:block;font:400 19px/1.15 var(--f-disp);letter-spacing:.01em;color:var(--card-ink);text-shadow:none}
.card small{display:block;color:var(--card-muted);font:700 13px/1.3 var(--f-body)}
.card .go{font:400 16px var(--f-disp);color:var(--green-b);text-align:right;white-space:nowrap}
.card[aria-disabled="true"]{cursor:not-allowed;background:linear-gradient(#eef2f8,#d8e1ee)}
.card[aria-disabled="true"] .go{color:#c0392b;text-transform:none;font:800 13px var(--f-body);max-width:14ch;white-space:normal}
.card.done{border-color:#5fd08a;background:linear-gradient(#f4fff7,#d6f5e1)}
.card .coin,.card .prestige{text-shadow:none}
.card .coin{color:#c98a00}
.card .prestige{color:#8a52e0}
/* Rows with a thumbnail and a Build button (build list, collection, missions) */
.row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px 10px 8px 8px;border-radius:16px;color:var(--card-ink);
  background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);box-shadow:0 3px 0 rgba(10,40,100,.35);cursor:pointer;text-align:left;width:100%;box-sizing:border-box;font-weight:800}
.row.locked{background:linear-gradient(#e6ebf3,#cdd7e6)}
.row .thumb{width:64px;height:72px;border-radius:12px;background:linear-gradient(#bfe3ff,#8ec8ff);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--card-line);display:grid;place-items:center;overflow:hidden}
.row .thumb img{width:100%;height:100%;object-fit:contain}
.row .thumb svg{width:40px;height:40px}
.row.locked .thumb img{filter:brightness(.1) saturate(0);opacity:.55}
.row b{display:block;font:400 19px/1.1 var(--f-disp);color:var(--card-ink)}
.row small{display:block;color:var(--card-muted);font:700 13px/1.3 var(--f-body)}
.row .cost{display:flex;align-items:center;gap:4px;font:400 17px var(--f-disp);color:var(--card-ink);margin-top:2px}
.row .cost svg{width:20px;height:20px}
.row .act{min-width:74px}
.row .lock{display:flex;flex-direction:column;align-items:center;gap:2px;font:400 14px var(--f-disp);color:#58698a;min-width:62px}
.row .lock svg{width:28px;height:28px}
.row .meter{margin-top:6px;height:10px}
.row.done{border-color:#5fd08a;background:linear-gradient(#f4fff7,#d6f5e1)}
.ric{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(#fff3c4,#ffd76a);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--card-line)}
.ric svg{width:36px;height:36px}
.stats{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:15px}
.stats dt{color:var(--muted);font-weight:700}
.stats dd{margin:0;text-align:right;font:400 18px var(--f-disp);letter-spacing:.01em;font-variant-numeric:tabular-nums;text-shadow:var(--outline)}
.whitebox{padding:12px;border-radius:16px;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);box-shadow:0 3px 0 rgba(10,40,100,.35)}
.whitebox .stats dt{color:var(--card-muted)}
.whitebox .stats dd{text-shadow:none;color:var(--card-ink)}
.whitebox h3{text-shadow:none;color:var(--card-ink);margin:0 0 6px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big div{display:flex;flex-direction:column;align-items:center;padding:8px;border-radius:16px;background:rgba(0,30,90,.28)}
.big b{font:400 38px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:var(--outline)}
.big small{font:800 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stars{display:flex;gap:6px;justify-content:center}
.stars i{width:44px;height:44px;background:rgba(0,30,90,.4);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:transform .25s,background .25s}
.stars i.on{background:linear-gradient(#ffe45a,#ffa412);transform:scale(1.15)}
.stars.small{gap:2px;justify-content:flex-start}
.stars.small i{width:18px;height:18px;background:#b9c6dc}
.stars.small i.on{background:linear-gradient(#ffe45a,#ffa412);transform:none}
.rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rewards span{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:14px;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);font:400 21px var(--f-disp)}
.rewards svg{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:4px 10px;border-radius:999px;background:linear-gradient(var(--yellow-a),var(--yellow-b));border:1.5px solid var(--yellow-edge);color:#5a3200;font:800 13px var(--f-body)}
.note{margin:0;color:#b9ffd5;font-weight:800;text-shadow:var(--outline)}
.note:empty{display:none}
.meter{display:block;height:10px;border-radius:5px;background:rgba(0,20,60,.35);overflow:hidden;border:1.5px solid rgba(255,255,255,.6);box-sizing:border-box}
.meter i{display:block;height:100%;border-radius:4px;background:var(--c,linear-gradient(#ffe45a,#ffb416))}
.row .meter,.whitebox .meter,.card .meter{background:#cdd9ea;border-color:#a9bfdc}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:16px;padding:10px 12px;border-radius:14px;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink)}
.setting>span:first-child{display:flex;align-items:center;gap:10px}
.setting .sic{width:28px;height:28px;flex:none}
.setting small{display:block;color:var(--card-muted);font-size:13px;font-weight:700}
.switch{position:relative;display:inline-block;width:56px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:#b9c6dc;box-shadow:inset 0 2px 3px rgba(0,0,0,.2);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+span{background:linear-gradient(var(--green-a),var(--green-b))}
.switch input:checked+span::after{transform:translateX(24px)}
select{font:800 15px var(--f-body);color:var(--card-ink);background:#fff;border:2px solid var(--card-line);border-radius:10px;padding:7px 10px}
select option{color:#111}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.howto li{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:baseline}
.howto b{font:400 18px var(--f-disp);color:var(--accent);text-shadow:var(--outline)}
.howto span{font-size:15px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach div{padding:10px;border-radius:14px;background:linear-gradient(#eef2f8,#d8e1ee);border:2px solid var(--card-line);color:var(--card-ink)}
.variants{display:flex;gap:6px;margin-top:7px}
.vsw{width:30px;height:30px;border-radius:8px;background:var(--c);border:2px solid #fff;cursor:pointer;padding:0;box-shadow:0 0 0 1.5px var(--card-line),inset 0 4px 0 rgba(255,255,255,.3)}
.vsw.on{box-shadow:0 0 0 3px #ffb416}
.vsw[aria-disabled="true"]{opacity:.28;cursor:not-allowed}
.variants.wrap{flex-wrap:wrap}
.studio{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
#stPrev{width:96px;height:330px;border-radius:14px;background:linear-gradient(#8ec8ff,#dff0ff);border:2px solid #fff}
.stForm{display:grid;gap:8px;min-width:0}
.stForm .setting{display:flex;flex-direction:column;align-items:stretch;gap:3px;font:800 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--card-muted)}
.stForm .setting b{color:var(--card-ink)}
.stForm select,.stForm input{width:100%;box-sizing:border-box;min-width:0;text-transform:none;letter-spacing:0}
.stForm input[type=range]{accent-color:#ffb416;margin:4px 0}
.stForm input:not([type]){font:800 15px var(--f-body);color:var(--card-ink);background:#fff;border:2px solid var(--card-line);border-radius:10px;padding:7px 9px}
.stForm .vsw{width:26px;height:26px}
.ach.tiers{grid-template-columns:repeat(3,1fr)}
.ach div.on{border-color:#ffb416;background:linear-gradient(#fffbe6,#ffe89a)}
.ach b{display:block;font:400 16px var(--f-disp);color:var(--card-ink)}
.ach small{display:block;color:var(--card-muted);font-size:12px;line-height:1.3}
.ach .coin{color:#c98a00}.ach .prestige{color:#8a52e0}
.ach div:not(.on) b{color:#6e7f9c}
.streak{display:flex;align-items:center;gap:10px;font:400 24px var(--f-disp);text-shadow:var(--outline)}
.streak svg{width:30px;height:30px}
.days{display:flex;gap:6px}
.days span{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;background:rgba(0,30,90,.3);font:800 12px var(--f-body);color:var(--muted)}
.days span i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)}
.days span.on i{background:var(--accent)}
.days span.today{outline:2px solid var(--accent)}
.toasts{position:absolute;left:50%;top:calc(var(--top) + 150px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
.toast{padding:9px 16px;border-radius:14px;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);font:800 15px var(--f-body);text-align:center;box-shadow:0 3px 0 rgba(10,40,100,.35);animation:toast 3.2s ease forwards}
.toast.good{border-color:#5fd08a;background:linear-gradient(#f4fff7,#d6f5e1)}
.toast.ach{border-color:#b38cff;background:linear-gradient(#faf5ff,#e9dcff)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px) scale(.95)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.lvup{text-align:center;align-items:center}
.lvup .num{font:400 96px/1 var(--f-disp);color:var(--accent);text-shadow:0 5px 0 #a55300,0 0 4px #a55300}
.unlocks{display:grid;gap:6px;width:100%}
.unlocks div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:14px;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);font:800 15px var(--f-body)}
.unlocks div b{color:#e07b00}
.unlocks div small{color:var(--card-muted);font:800 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase}

/* ---------- Title screen (Play, side menu, bottom bar) ---------- */
.title-screen{justify-content:flex-start;align-items:stretch;padding:0;background:linear-gradient(rgba(20,70,160,.35),rgba(20,70,160,0) 40%,rgba(8,26,66,.6))}
.t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(var(--top) + 10px) 10px 0}
.t-top .gear{margin-left:auto;pointer-events:auto}
.logo{margin:18px auto 0;text-align:center;font:400 clamp(52px,15vw,84px)/.86 var(--f-disp);letter-spacing:.01em;text-transform:uppercase;
  filter:drop-shadow(0 5px 0 #0c3a8c) drop-shadow(0 0 2px #0c3a8c) drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.logo span{display:block;text-shadow:none;background:linear-gradient(#fff7a8,#ffd23a 45%,#ff9a1a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #8a3c00}
.logo span+span{font-size:1.12em;background:linear-gradient(#ffffff,#bfe6ff 50%,#58b0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px #0c3a8c}
.t-lede{margin:12px auto 0;max-width:30ch;text-align:center;color:#fff;font:800 15px/1.35 var(--f-body);text-shadow:var(--outline)}
.t-lede b{color:var(--accent)}
.t-play{margin:16px auto 0;width:min(300px,76%);min-height:72px;font-size:38px;border-radius:22px}
.t-side{position:absolute;left:10px;top:calc(var(--top) + 330px);display:flex;flex-direction:column;gap:12px}
.side-btn{position:relative;display:flex;align-items:center;gap:8px;min-width:132px;padding:6px 14px 6px 6px;border-radius:16px;cursor:pointer;color:#fff;font:400 18px var(--f-disp);text-shadow:var(--outline);
  background:linear-gradient(rgba(70,150,250,.95),rgba(34,96,210,.95));border:2px solid var(--blue-edge);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 3px 0 var(--blue-edge)}
.side-btn svg{width:40px;height:40px;filter:drop-shadow(0 2px 0 rgba(9,38,92,.45))}
.side-btn .badge{top:-6px;right:-6px}
.t-foot{margin-top:auto}
.t-foot .best{text-align:center;padding:0 12px 8px}
.t-nav{position:relative;background:linear-gradient(rgba(18,56,130,0),rgba(14,44,104,.85) 40%)}
@media (min-width:760px){.t-side{left:24px;top:auto;bottom:140px}.t-play{width:320px}}
@media (max-height:700px){.t-side{top:auto;bottom:128px;flex-direction:row;left:8px;right:8px;justify-content:center;flex-wrap:wrap;gap:8px}.side-btn{min-width:0;font-size:15px}.side-btn svg{width:30px;height:30px}.logo{font-size:48px}.t-play{min-height:60px;font-size:30px}}

/* ---------- World map, info card, city stats, shop, collection ---------- */
.wmap{position:relative;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--edge);background:radial-gradient(120% 80% at 50% 30%,#4fc3f7,#1e88e5 70%,#1565c0)}
.wmap>svg:first-child{display:block;width:100%;height:auto}
.wnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:5px 11px 6px;border-radius:14px;
  background:linear-gradient(rgba(70,150,250,.95),rgba(34,96,210,.95));border:2px solid #fff;box-shadow:0 3px 0 rgba(9,38,92,.6);color:#fff;font:400 15px/1.05 var(--f-disp);text-shadow:var(--outline);white-space:nowrap}
.wnode small{display:flex;align-items:center;gap:3px;font:400 13px var(--f-disp);color:var(--coin)}
.wnode small svg{width:14px;height:14px}
.wnode.locked{background:linear-gradient(rgba(60,78,110,.95),rgba(36,50,80,.95))}
.wnode.locked small{color:#dbe6f5}
.wnode.sel{outline:3px solid #ffe45a;outline-offset:1px}
.wnode.here{background:linear-gradient(var(--yellow-a),var(--yellow-b));border-color:#fff;text-shadow:0 2px 0 var(--yellow-edge)}
.wnode.here small{color:#fff}
.wpin{position:absolute;transform:translate(-50%,-100%);width:34px;height:46px;pointer-events:none;animation:hop 1.2s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:stretch}
.info .hero{position:relative;border-radius:18px;background:linear-gradient(#bfe3ff,#8ec8ff);border:3px solid #fff;box-shadow:0 0 0 2px var(--card-line);display:grid;place-items:end center;min-height:230px;overflow:hidden}
.info .hero img{width:100%;height:100%;object-fit:contain}
.info .hero .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:44px;border-radius:10px;border:2px solid var(--yellow-edge);background:linear-gradient(var(--yellow-a),var(--yellow-b));color:#fff;font:400 24px/1 var(--f-disp);padding:0;cursor:pointer;box-shadow:0 3px 0 var(--yellow-edge)}
.info .hero .nav.l{left:6px}.info .hero .nav.r{right:6px}
.info .facts{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:16px;background:rgba(0,30,90,.32);border:2px solid rgba(255,255,255,.25)}
.info .facts h3{margin:0;font-size:21px}
.info .facts .role{font:800 13px var(--f-body);color:var(--muted);margin-top:-4px}
.fact{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;font:800 12px var(--f-body);color:var(--muted)}
.fact svg{width:24px;height:24px}
.fact b{display:block;font:400 17px/1.1 var(--f-disp);color:#fff;text-shadow:var(--outline)}
.fact .stars.small i{width:15px;height:15px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:58px;height:66px;border-radius:12px;padding:0;cursor:pointer;background:linear-gradient(#bfe3ff,#8ec8ff);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--card-line);overflow:hidden}
.strip button.on{box-shadow:0 0 0 3px #ffb416}
.strip button.locked img{filter:brightness(.1) saturate(0);opacity:.55}
.strip img{width:100%;height:100%;object-fit:contain}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;gap:8px;align-items:center;padding:10px;border-radius:16px;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);box-shadow:0 3px 0 rgba(10,40,100,.35)}
.tile svg{width:34px;height:34px}
.tile small{display:block;color:var(--card-muted);font:800 12px var(--f-body)}
.tile b{display:block;font:400 21px/1.05 var(--f-disp)}
.tile em{display:block;font-style:normal;font:800 12px var(--f-body);color:#2f9a26}
.tile em.down{color:#c0392b}
.dchart{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;padding:12px 12px 8px;border-radius:16px;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink)}
.dchart div{display:flex;flex-direction:column;align-items:center;gap:4px;font:800 12px var(--f-body);color:var(--card-muted)}
.dchart .bar{position:relative;width:30px;height:84px;border-radius:8px;background:#dbe5f3;border:2px solid #b9cbe4;overflow:hidden;box-sizing:border-box}
.dchart .bar i{position:absolute;left:0;right:0;bottom:0;border-radius:5px 5px 0 0;background:var(--c);box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
.dchart svg{width:24px;height:24px}
.citycard{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.citycard .thumb{width:72px;height:72px;border-radius:14px;background:linear-gradient(#bfe3ff,#8ec8ff);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--card-line);overflow:hidden}
.citycard .thumb img{width:100%;height:100%;object-fit:cover}
.citycard b{font:400 22px var(--f-disp)}
.starbar{display:flex;align-items:center;gap:6px;font:400 15px var(--f-disp)}
.starbar .meter{flex:1}
.starbar svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:14px;cursor:pointer;background:linear-gradient(var(--card-a),var(--card-b));border:2px solid var(--card-line);color:var(--card-ink);box-shadow:0 3px 0 rgba(10,40,100,.35);text-align:center}
.gcell .thumb{width:100%;aspect-ratio:4/5;border-radius:10px;background:linear-gradient(#bfe3ff,#8ec8ff);overflow:hidden;display:grid;place-items:center}
.gcell .thumb img{width:100%;height:100%;object-fit:contain}
.gcell b{font:400 13px/1.1 var(--f-disp);min-height:2.2em;display:flex;align-items:center}
.gcell.locked{background:linear-gradient(#5d7196,#3f5276);border-color:#2c3c5c;color:#fff}
.gcell.locked .thumb{background:linear-gradient(#4a5e84,#33466a)}
.gcell.locked .thumb img{filter:brightness(0);opacity:.55}
.gcell .lk{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px}
.gcell.locked small{font:400 12px var(--f-disp);color:#fff}
.shopcard{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:18px;color:#fff;border:3px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(9,38,92,.6);background:linear-gradient(135deg,#8e5bff,#5b2fd6)}
.shopcard.gold{background:linear-gradient(135deg,#ffcf3a,#ff8a1a)}
.shopcard.green{background:linear-gradient(135deg,#5fd86b,#20a060)}
.shopcard.blue{background:linear-gradient(135deg,#5fb8ff,#2a6fe0)}
.shopcard .art{width:72px;height:72px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.2)}
.shopcard .art svg{width:52px;height:52px}
.shopcard b{display:block;font:400 21px/1.05 var(--f-disp);text-shadow:var(--outline)}
.shopcard small{display:block;font:800 13px var(--f-body);color:#fff;opacity:.95}
.shopcard .btn{min-height:42px;font-size:17px;padding:5px 12px}
.evcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;color:#fff;border:3px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(9,38,92,.6);background:linear-gradient(135deg,#ffb23a,#ff6a3a)}
.evcard.blue{background:linear-gradient(135deg,#5fb8ff,#2a6fe0)}
.evcard.green{background:linear-gradient(135deg,#5fd86b,#20a060)}
.evcard.purple{background:linear-gradient(135deg,#b58cff,#6b3fd6)}
.evcard .ribbon{align-self:center;margin-top:-4px;padding:4px 18px;border-radius:10px;background:linear-gradient(#ff6a5a,#d8352a);border:2px solid #fff;font:400 20px var(--f-disp);text-shadow:0 2px 0 #8a1a10;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.evcard .evrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.evcard b{font:400 20px/1.1 var(--f-disp);text-shadow:var(--outline)}
.evcard small{display:block;font:800 13px/1.3 var(--f-body)}
.evcard .timer{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:rgba(0,20,60,.35);font:400 15px var(--f-disp)}
.evcard .timer svg{width:18px;height:18px}
.evcard .art{height:120px;border-radius:12px;background:linear-gradient(#bfe3ff,#8ec8ff);display:flex;align-items:flex-end;justify-content:center;gap:4px;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.evcard .art img{height:100%;object-fit:contain}
.chests{display:flex;gap:4px;justify-content:space-between}
.chest{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 1px;border-radius:12px;background:rgba(0,30,90,.32);border:2px solid rgba(255,255,255,.25);font:400 14px var(--f-disp);color:#fff;cursor:default}
.chest svg{width:28px;height:28px}
.chest.got{opacity:.55}
.chest.ready{background:linear-gradient(var(--yellow-a),var(--yellow-b));border-color:#fff;cursor:pointer;animation:hop 1s ease-in-out infinite;text-shadow:0 2px 0 var(--yellow-edge)}
.chest small{font:800 10px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%}
.chest.ready small{color:#fff}
.profile{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.profile .ava{width:64px;height:64px;border-radius:16px;background:linear-gradient(#ffe45a,#ffb416);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--card-line)}
.profile .ava svg{width:52px;height:52px}
.profile b{font:400 22px var(--f-disp)}
.profile input{font:400 20px var(--f-disp);color:var(--card-ink);border:2px solid var(--card-line);border-radius:10px;padding:4px 8px;width:100%;box-sizing:border-box}
.chev{color:var(--card-muted);font:400 20px var(--f-disp)}
@media (min-width:760px) and (min-aspect-ratio:1/1){.screen:not(.center):not(.title-screen){align-items:flex-start;padding-left:48px}}
@media (max-width:480px){
  .stab{padding:6px 10px;gap:6px;font-size:13px;letter-spacing:.04em}
  .stab .segs{display:none}
  .mult{min-width:96px;padding:5px 10px 8px}
  .mult b{font-size:28px}
  .mult span{font-size:11px;letter-spacing:.08em}
  .chip{height:34px;font-size:17px;padding-right:10px}
  .lvl .lbar i{width:60px}
  .demand{gap:8px;padding:6px 9px;flex-wrap:nowrap}
  .dbar .col{width:12px}
  .happy{padding-left:6px}
  .happy b{font-size:16px}
  .nav-btn{font-size:13px}
  .nav-btn svg{width:30px;height:30px}
  .info{grid-template-columns:1fr 1fr}
  .info .hero{min-height:210px}
}
@media (max-width:400px){.lvl .lbar{display:none}.lvl{padding-right:8px}}
@media (prefers-reduced-motion: reduce){.stab[data-level="3"]{animation:none}.banner.show{animation-duration:2.4s}.collect,.buildhere b,.buildhere svg,.wpin,.chest.ready{animation:none}}
/* Left-handed: mirror the readouts and buttons. */
body.lefty #pauseBtn{right:auto;left:14px}
body.lefty .stab{left:auto;right:14px}
body.lefty .gauge{left:auto;right:14px}
body.lefty .hud-br{right:auto;left:14px;align-items:flex-start}
body.lefty .combo{align-items:flex-start}
body.lefty .rail{right:auto;left:12px}
body.lefty .compass{right:auto;left:14px}
body.lefty .hub-bottom{align-items:flex-end}
body.lefty .goal,body.lefty .status{margin-left:auto}
body.lefty .ptop{left:auto;right:12px;flex-direction:row-reverse}
body.lefty .t-side{left:auto;right:10px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Skyline Forge. In the city, drag to pan, pinch or scroll to zoom and tap a lot. While building, tap to drop a floor."></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>

  <!-- City hub -->
  <div class="hub" id="hub" hidden>
    <div class="hub-top">
      <div class="chip glass lvl" id="lvlChip" role="button" tabindex="0" aria-label="City level">
        <span class="ring"><svg viewBox="0 0 46 46" aria-hidden="true"><path d="M23 2l18 9v14c0 10-8 17-18 19C13 42 5 35 5 25V11z" fill="#2c7ae6" stroke="#fff" stroke-width="3"/><circle cx="23" cy="24" r="13" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3.5"/><circle id="lvlRing" cx="23" cy="24" r="13" fill="none" stroke="#ffc928" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="81.7" stroke-dashoffset="81.7" transform="rotate(-90 23 24)"/></svg><b id="lvlNum">1</b></span>
        <span class="lbar"><span id="lvlNext">Level 2 at 40</span><i id="lvlBar"></i></span>
      </div>
      <div class="chip glass" title="Coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffc928" stroke="#b86a00" stroke-width="1.6"/><circle cx="12" cy="12" r="6.6" fill="#ffe45a" stroke="#d98a00" stroke-width="1.4"/><path d="M12 8.2v7.6" stroke="#b86a00" stroke-width="2" stroke-linecap="round"/></svg><span id="hubCoins">0</span><button class="plus" id="coinPlus" type="button" aria-label="Shop">+</button></div>
      <div class="chip glass prestige-chip" title="Prestige"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z" fill="#b57bff" stroke="#5a24b0" stroke-width="1.4" stroke-linejoin="round"/><path d="M2 9h20M8 3l-2 6 6 12 6-12-2-6" fill="none" stroke="#e4ccff" stroke-width="1.1"/></svg><span id="hubPrestige">0</span></div>
      <div class="chip glass" title="Population"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.6" fill="#ffd9a8" stroke="#123a78" stroke-width="1.2"/><path d="M1.8 20c0-3.8 2.8-6.6 6.2-6.6s6.2 2.8 6.2 6.6z" fill="#4fa3ff" stroke="#123a78" stroke-width="1.2"/><circle cx="16.5" cy="9" r="3" fill="#ffd9a8" stroke="#123a78" stroke-width="1.2"/><path d="M12.4 20c.4-3.3 2-5.4 4.1-5.4 2.8 0 5.2 2.3 5.2 5.4z" fill="#ff6a5a" stroke="#123a78" stroke-width="1.2"/></svg><span id="hubPop">0</span></div>
      <div class="chip glass" id="matChip" title="Materials" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4v9l-9 4-9-4z" fill="#d9a066" stroke="#6e4a2a" stroke-width="1.3" stroke-linejoin="round"/><path d="M3 8l9 4 9-4M12 12v9" fill="none" stroke="#6e4a2a" stroke-width="1.3"/><path d="M7.5 6l9 4" stroke="#f3cf9e" stroke-width="1.5"/></svg><span id="hubMat">0</span></div>
    </div>
    <button class="collect" id="collectBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff3c4" stroke="#b86a00" stroke-width="1.6"/><path d="M12 7.5v9M8.5 12.5l3.5 3.8 3.5-3.8" fill="none" stroke="#b86a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="collectTxt">Collect 0</span></button>
    <button class="compass glass" id="compass" type="button" aria-label="Face north"><svg viewBox="0 0 24 24" aria-hidden="true" id="compassNeedle"><path d="M12 3l3.2 9h-6.4z" fill="#ff5a4a"/><path d="M12 21l-3.2-9h6.4z" fill="currentColor"/></svg></button>
    <div class="rail">
      <button class="icon-btn" id="btnWorld" type="button" aria-label="World map" data-icon="globe"><small>World</small></button>
      <button class="icon-btn" id="btnMap" type="button" aria-label="Map overlays" data-icon="layers"><small>Layers</small></button>
      <button class="icon-btn" id="btnPhoto" type="button" aria-label="Photo mode" data-icon="camera"><small>Photo</small></button>
      <button class="icon-btn" id="btnMenu" type="button" aria-label="Settings" data-icon="gear"><small>Menu</small></button>
    </div>
    <div class="hub-bottom">
      <div class="status"><button class="spill glass" id="evPill" type="button" hidden></button><button class="spill glass" id="wxPill" type="button"></button></div>
      <div class="ovkey glass" id="ovKey" hidden><b id="ovName">Land value</b><span id="ovLo">Low</span><i id="ovRamp"></i><span id="ovHi">High</span></div>
      <div class="goal" id="goal" role="button" tabindex="0"></div>
      <div class="demand glass" aria-label="Demand">
        <span class="dbar" style="--c:var(--res)"><span class="col"><i id="dR"></i></span>R</span>
        <span class="dbar" style="--c:var(--com)"><span class="col"><i id="dC"></i></span>C</span>
        <span class="dbar" style="--c:var(--off)"><span class="col"><i id="dO"></i></span>O</span>
        <span class="happy">Happy<b id="happy">55%</b></span>
        <span class="happy">Income<b id="income">0/h</b></span>
        <span class="happy" id="gridBox"><span id="gridLbl">Grid</span><b id="grid">OK</b></span>
        <span class="happy" id="trafBox">Roads<b id="traffic">Light</b></span>
      </div>
    </div>
    <nav class="navbar" aria-label="Main">
      <button class="nav-btn" id="btnShop" type="button" data-icon="shop">Shop</button>
      <button class="nav-btn" id="btnCollection" type="button" data-icon="album">Collection</button>
      <button class="nav-btn hot" id="btnContracts" type="button" data-icon="missions">Missions<span class="badge" id="badgeContracts" hidden>0</span></button>
      <button class="nav-btn" id="btnEvents" type="button" data-icon="events">Events<span class="badge" id="badgeDaily" hidden>!</span></button>
      <button class="nav-btn" id="btnCity" type="button" data-icon="city">City<span class="badge" id="badgeTrophies" hidden>!</span></button>
    </nav>
  </div>

  <!-- Photo mode -->
  <div class="photo" id="photo" hidden>
    <div class="ptop"><button class="icon-btn glass" id="pExit" type="button" aria-label="Leave photo mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2"/></svg></button><span class="ptitle">Photo mode</span></div>
    <p class="phint">Drag to orbit · pinch or scroll to zoom · two fingers to pan · tap to hide the controls</p>
    <div class="pbar glass">
      <button class="pbtn" type="button" data-p="tod"><small>Time</small><b>Day</b></button>
      <button class="pbtn" type="button" data-p="wx"><small>Weather</small><b>Clear</b></button>
      <button class="pbtn" type="button" data-p="lens"><small>Lens</small><b>35mm</b></button>
      <button class="pbtn" type="button" data-p="filter"><small>Filter</small><b>Natural</b></button>
      <button class="pbtn" type="button" data-p="focus"><small>Focus</small><b>Off</b></button>
    </div>
    <div class="pshoot"><span class="pbtn ghostbtn" aria-hidden="true"></span><button class="shutter" id="pShot" type="button" aria-label="Take a picture"></button><button class="pbtn glass" id="pShare" type="button" hidden><small>Save &amp;</small><b>Share</b></button></div>
  </div>
  <div class="flash" id="flash" hidden></div>
  <div class="fade" id="fade" hidden></div>

  <!-- Construction HUD -->
  <div class="hud" id="hud" hidden>
    <div class="stab glass" id="stab" data-level="0" role="status" aria-live="polite">
      <span class="ico" id="stabIco" aria-hidden="true">●</span><span class="txt" id="stabTxt">Stable</span>
      <span class="segs" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="bpname" id="bpName"></div>
    <div class="mult glass" id="mult" hidden aria-hidden="true">
      <b id="multVal">×1.0</b><span id="multLbl">Safe</span><span class="bar"><i id="multBar"></i></span>
    </div>
    <button class="icon-btn glass" id="pauseBtn" type="button" aria-label="Pause">II</button>
    <div class="coach" id="coach" hidden></div>
    <div class="banner" id="banner" hidden><b id="bannerTitle"></b><span id="bannerSub"></span></div>
    <div class="gauge">
      <span class="gauge-badge" id="hudBadge">0</span>
      <span class="gauge-bar" id="gaugeBar"><i id="gaugeFill"></i></span>
      <span class="gauge-label" id="hudLabel">Floors</span>
    </div>
    <div class="hud-br">
      <div class="combo" id="combo" hidden><span id="comboLabel">Combo ×1</span><div class="combo-bar"><i id="comboFill"></i></div></div>
      <div class="lives" id="lives" aria-label="Lives"></div>
      <span class="hud-pop glass" aria-label="Points">
        <svg viewBox="0 0 11 8" aria-hidden="true"><rect x="1" y="0" width="3" height="3" fill="#e0b060"/><rect x="0" y="3" width="5" height="3" fill="#c98a2e"/><rect x="1" y="6" width="1" height="2" fill="#c98a2e"/><rect x="3" y="6" width="1" height="2" fill="#c98a2e"/><rect x="7" y="0" width="3" height="3" fill="#e0b060"/><rect x="6" y="3" width="5" height="3" fill="#c98a2e"/><rect x="7" y="6" width="1" height="2" fill="#c98a2e"/><rect x="9" y="6" width="1" height="2" fill="#c98a2e"/></svg>
        <span id="hudPop">0</span>
      </span>
    </div>
  </div>

  <!-- Title -->
  <section class="screen title-screen" id="title" hidden>
    <div class="t-top">
      <div class="chip glass lvl" aria-label="City level"><span class="ring"><svg viewBox="0 0 46 46" aria-hidden="true"><path d="M23 2l18 9v14c0 10-8 17-18 19C13 42 5 35 5 25V11z" fill="#2c7ae6" stroke="#fff" stroke-width="3"/></svg><b id="tLvl">1</b></span><span class="lbar"><span id="tLvlNext"></span><i id="tLvlBar"></i></span></div>
      <div class="chip glass" title="Coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffc928" stroke="#b86a00" stroke-width="1.6"/><circle cx="12" cy="12" r="6.6" fill="#ffe45a" stroke="#d98a00" stroke-width="1.4"/><path d="M12 8.2v7.6" stroke="#b86a00" stroke-width="2" stroke-linecap="round"/></svg><span id="tCoins">0</span><button class="plus" id="tCoinPlus" type="button" aria-label="Shop">+</button></div>
      <div class="chip glass prestige-chip" title="Prestige"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z" fill="#b57bff" stroke="#5a24b0" stroke-width="1.4" stroke-linejoin="round"/><path d="M2 9h20M8 3l-2 6 6 12 6-12-2-6" fill="none" stroke="#e4ccff" stroke-width="1.1"/></svg><span id="tGems">0</span></div>
      <button class="icon-btn gear" id="btnTitleSettings" type="button" aria-label="Settings" data-icon="gear"></button>
    </div>
    <h1 class="logo"><span>Skyline</span><span>Forge</span></h1>
    <p class="t-lede" id="titleLede"></p>
    <button class="btn primary t-play" id="btnPlay" type="button">Play</button>
    <div class="t-side">
      <button class="side-btn" id="tMap" type="button" data-icon="map">Map</button>
      <button class="side-btn" id="tBuildings" type="button" data-icon="buildings">Buildings</button>
      <button class="side-btn" id="tMissions" type="button" data-icon="missions">Missions<span class="badge" id="tBadgeM" hidden>!</span></button>
      <button class="side-btn" id="tEvents" type="button" data-icon="events">Events<span class="badge" id="tBadgeE" hidden>!</span></button>
    </div>
    <div class="t-foot">
      <p class="best" id="bestLine"></p>
      <nav class="navbar t-nav" aria-label="Title">
        <button class="nav-btn" id="tShop" type="button" data-icon="shop">Shop</button>
        <button class="nav-btn hot" id="tCity" type="button" data-icon="city">City</button>
        <button class="nav-btn" id="tCollection" type="button" data-icon="album">Collection</button>
      </nav>
    </div>
  </section>

  <!-- Pause -->
  <section class="screen center" id="pause" hidden>
    <div class="panel">
      <h2>Paused</h2>
      <p class="lede" id="pauseInfo"></p>
      <div class="btns">
        <button class="btn primary" id="btnResume" type="button">Resume</button>
        <div class="btn-row">
          <button class="btn" id="btnRestart" type="button">Restart</button>
          <button class="btn" id="btnPauseSettings" type="button">Settings</button>
        </div>
        <button class="btn ghost" id="btnQuit" type="button">Stop building</button>
      </div>
    </div>
  </section>

  <!-- Results -->
  <section class="screen" id="result" hidden>
    <div class="panel">
      <div>
        <p class="eyebrow" id="resEyebrow"></p>
        <h2 id="resTitle"></h2>
      </div>
      <div class="stars" id="resStars" aria-label="Stars"><i></i><i></i><i></i></div>
      <div class="big">
        <div><b id="resHeight">0</b><small id="resHeightSub">floors</small></div>
        <div><b id="resCap">0</b><small id="resCapSub">residents</small></div>
      </div>
      <div class="rewards" id="resRewards"></div>
      <dl class="stats" id="resStats"></dl>
      <div class="chips" id="resChips"></div>
      <p class="note" id="resNote"></p>
      <div class="btn-row">
        <button class="btn primary" id="resPrimary" type="button"></button>
        <button class="btn" id="resSecondary" type="button"></button>
      </div>
    </div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden><div class="panel" id="modalPanel"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <section class="screen center" id="fatal" hidden>
    <div class="panel"><h2>Can't start</h2><p class="lede" id="fatalText"></p></div>
  </section>
</div>
