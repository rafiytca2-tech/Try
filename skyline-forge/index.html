<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Skyline Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#f5f2ec;
  --muted:#b3bcc6;
  --glass:rgba(10,16,24,.6);
  --glass-strong:rgba(10,16,24,.9);
  --line:rgba(255,255,255,.14);
  --accent:#ffc21a;
  --accent-ink:#1a1302;
  --gauge:#cfe04c;
  --combo:#9ff0ff;
  --stable:#39d98a;
  --moving:#ffd23f;
  --danger:#ff8a2b;
  --critical:#ff4a3d;
  --coin:#ffd257;
  --prestige:#c9a8ff;
  --res:#4f93ec; --com:#e3584a; --off:#45c64a;
  --f-cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;
  --f-body:"Barlow","Roboto",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:#0b1118;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
body.big{font-size:18px}
#stage{position:fixed;inset:0;overflow:hidden;background:#0b1118;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx,#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button{font:inherit;color:inherit}
.btn{
  min-height:48px;padding:10px 18px;border-radius:14px;cursor:pointer;font:700 17px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);
}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.btn.danger{color:var(--critical)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible,.icon-btn:focus-visible,.switch input:focus-visible+span,select:focus-visible,.card:focus-visible,.tab:focus-visible{outline:3px solid #fff;outline-offset:3px}
.icon-btn{
  pointer-events:auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;cursor:pointer;padding:0;position:relative;
  color:var(--ink);font:700 16px var(--f-cond);letter-spacing:.06em;
}
.icon-btn svg{width:24px;height:24px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--critical);color:#fff;font:700 12px/18px var(--f-cond);text-align:center}
.coin{color:var(--coin)}
.go svg,.stats svg,.sub svg,.card svg,.unlocks svg{width:16px;height:16px;vertical-align:-3px}
.prestige{color:var(--prestige)}

/* ---------- Construction HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-cond);text-shadow:0 2px 10px rgba(0,0,0,.45)}
#pauseBtn{position:absolute;top:calc(var(--top) + 12px);right:14px}
.stab{
  position:absolute;left:14px;top:calc(var(--top) + 12px);display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
}
.stab .segs{display:flex;gap:3px}
.stab .segs i{width:12px;height:5px;border-radius:2px;background:rgba(255,255,255,.16)}
.stab[data-level="0"]{--c:var(--stable)}
.stab[data-level="1"]{--c:var(--moving)}
.stab[data-level="2"]{--c:var(--danger)}
.stab[data-level="3"]{--c:var(--critical);animation:pulse .5s ease-in-out infinite alternate}
.stab .ico,.stab .txt{color:var(--c)}
.stab[data-level="0"] .segs i:nth-child(-n+1),
.stab[data-level="1"] .segs i:nth-child(-n+2),
.stab[data-level="2"] .segs i:nth-child(-n+3),
.stab[data-level="3"] .segs i{background:var(--c)}
@keyframes pulse{to{box-shadow:0 0 0 3px rgba(255,74,61,.45)}}
.mult{
  position:absolute;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:112px;box-sizing:border-box;padding:6px 14px 9px;border-radius:14px;
}
.mult b{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mult span{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mult .bar{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.mult .bar i{display:block;height:100%;width:0;background:var(--accent)}
.mult.warn b,.mult.warn span{color:var(--critical)}
.mult.warn .bar i{background:var(--critical)}
.mult.power b{color:var(--accent)}
.bpname{position:absolute;left:50%;top:calc(var(--top) + 68px);transform:translateX(-50%);font:600 14px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.gauge{position:absolute;left:14px;bottom:calc(var(--bot) + 16px);display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge-badge{
  min-width:40px;box-sizing:border-box;text-align:center;padding:3px 8px;border-radius:8px;font-weight:700;font-size:22px;line-height:1.05;
  color:#f1ffb8;background:rgba(23,50,15,.85);border:2px solid var(--gauge);font-variant-numeric:tabular-nums;
}
.gauge-badge small{font-size:14px;opacity:.75}
.gauge-bar{position:relative;width:14px;height:112px;border-radius:4px;background:rgba(12,12,12,.8);border:2px solid var(--gauge)}
.gauge-bar i{position:absolute;left:2px;right:2px;bottom:2px;height:0;background-image:repeating-linear-gradient(to top,var(--c,#3cbf3c) 0 6px,transparent 6px 8px)}
.gauge-label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;max-width:110px;text-align:center}
.hud-br{position:absolute;right:14px;bottom:calc(var(--bot) + 16px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hud-pop{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.hud-pop svg{width:24px;height:18px}
.lives{display:flex;gap:6px}
.life{width:22px;height:15px;color:var(--accent);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.life.lost{color:rgba(255,255,255,.22)}
.combo{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.combo span{font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--combo);text-transform:uppercase}
.combo-bar{width:96px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.combo-bar i{display:block;height:100%;margin-left:auto;background:var(--combo)}
.coach{
  position:absolute;left:50%;top:calc(var(--top) + 96px);transform:translateX(-50%);
  width:max-content;max-width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:10px 14px;border-radius:14px;
  background:var(--glass-strong);border:1px solid var(--line);font:15px/1.4 var(--f-body);text-align:center;text-shadow:none;pointer-events:none;
}
.coach b{color:var(--accent);font-weight:600}
.banner{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;pointer-events:none;font-family:var(--f-cond);text-shadow:0 2px 14px rgba(0,0,0,.55)}
.banner b{font-size:38px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);line-height:1}
.banner span{font-size:20px;font-weight:600;letter-spacing:.08em}
.banner.show{animation:bannerIn 1.9s ease-out forwards}
@keyframes bannerIn{0%{opacity:0;transform:translateY(10px) scale(.96)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.pop{
  position:absolute;left:0;top:0;white-space:nowrap;text-align:center;will-change:transform,opacity;
  font-family:var(--f-cond);font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase;line-height:1;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.pop.perfect{color:var(--accent);font-size:32px}
.pop.excellent{color:#8ff0c2}
.pop.great{color:#8fd3ff}
.pop.good{color:var(--ink)}
.pop.rough{color:#ffd08a}
.pop.dangerous{color:var(--danger)}
.pop.miss{color:var(--critical)}
.pop.combo{color:var(--combo);font-size:20px}
.pop.pts{font-size:20px;color:var(--ink)}
.pop.info{font-size:17px;color:var(--muted)}
.pop.bonus{font-size:22px;color:var(--stable)}
.pop.coinpop{font-size:24px;color:var(--coin)}

/* ---------- City hub HUD ---------- */
.hub{position:absolute;inset:0;pointer-events:none}
.hub-top{position:absolute;left:12px;right:12px;top:calc(var(--top) + 10px);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{pointer-events:auto;display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;font:700 19px var(--f-cond);letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:20px;height:20px;flex:none}
.lvl{gap:9px;padding-left:6px;cursor:pointer}
.lvl .ring{position:relative;width:30px;height:30px;flex:none}
.lvl .ring svg{width:30px;height:30px;transform:rotate(-90deg)}
.lvl .ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--f-cond)}
.lvl .lbar{display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1}
.lvl .lbar i{display:block;width:74px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.lvl .lbar i::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--accent)}
.collect{
  pointer-events:auto;position:absolute;left:50%;top:calc(var(--top) + 62px);transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;cursor:pointer;
  font:700 18px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--coin);border:0;
  box-shadow:0 6px 20px rgba(0,0,0,.35);animation:bob 1.6s ease-in-out infinite;
}
.collect svg{width:20px;height:20px}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
.rail{position:absolute;right:12px;top:calc(var(--top) + 116px);display:flex;flex-direction:column;gap:10px}
.rail .icon-btn{width:52px;height:52px}
.rail .icon-btn.on{outline:2px solid var(--accent);color:var(--accent)}
.rail small{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font:600 11px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.8);white-space:nowrap}
.rail .icon-btn{margin-bottom:10px}
.hub-bottom{position:absolute;left:12px;right:12px;bottom:calc(var(--bot) + 12px);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.demand{pointer-events:auto;display:flex;align-items:flex-end;gap:12px;padding:8px 12px;border-radius:14px;font:600 13px var(--f-cond);letter-spacing:.1em;text-transform:uppercase}
.dbar{display:flex;flex-direction:column;align-items:center;gap:3px}
.dbar .col{position:relative;width:14px;height:40px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.dbar .col::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.35)}
.dbar .col i{position:absolute;left:0;right:0;background:var(--c)}
.happy{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding-left:6px;border-left:1px solid var(--line);color:var(--muted)}
.happy b{font-size:20px;color:var(--ink)}
.happy b.warn{color:var(--moving)}
.happy b.bad{color:var(--danger)}
.demand{flex-wrap:wrap;cursor:pointer}
.status{display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.spill{pointer-events:auto;display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;cursor:pointer;color:var(--ink);font:700 14px var(--f-cond);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.spill i{font-style:normal;color:var(--accent);font-size:16px}
.spill small{font:600 13px var(--f-cond);color:var(--muted);letter-spacing:.04em}
.spill.bonus small{color:var(--stable)}
.ovkey{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;font:600 13px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ovkey b{color:var(--ink)}
.ovkey i{display:block;width:70px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--a),var(--b),var(--c))}
.goal{pointer-events:auto;max-width:min(440px,calc(100% - 70px));padding:9px 14px;border-radius:14px;font:500 15px/1.35 var(--f-body);cursor:pointer}
.goal b{color:var(--accent);font-weight:600}
.dlabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font:700 15px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9)}
.dlabel small{display:block;font:600 13px var(--f-cond);letter-spacing:.06em;color:var(--coin);text-transform:none}
.dlabel.locked{color:rgba(255,255,255,.75)}
.tlabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;padding:3px 8px;border-radius:8px;background:rgba(10,16,24,.78);font:700 13px var(--f-cond);letter-spacing:.06em;color:var(--ink)}
.tlabel.warn{color:var(--moving)}

/* ---------- Screens, sheets, modals ---------- */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow-y:auto;cursor:default;
  padding:20px;padding-block:calc(var(--top) + 20px) calc(var(--bot) + 20px);box-sizing:border-box;
  background:linear-gradient(to top,rgba(8,12,18,.85),rgba(8,12,18,0) 62%);
}
.screen.center{justify-content:center;background:rgba(8,12,18,.6)}
.panel{
  width:100%;max-width:460px;box-sizing:border-box;padding:22px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:14px;
}
.eyebrow{margin:0;font:600 13px var(--f-cond);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.wordmark{margin:0;font-family:var(--f-cond);font-weight:700;font-size:clamp(46px,12vw,68px);line-height:.86;letter-spacing:.02em;text-transform:uppercase}
.wordmark span{display:block;color:var(--accent)}
h2{margin:0;font-family:var(--f-cond);font-weight:700;font-size:30px;line-height:1.02;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h3{margin:0;font:700 18px var(--f-cond);letter-spacing:.08em;text-transform:uppercase}
.lede{margin:0;color:var(--muted);max-width:40ch}
.lede b{color:var(--ink);font-weight:600}
.btns{display:flex;flex-direction:column;gap:10px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row.three{grid-template-columns:1fr 1fr 1fr}
.best{margin:0;font:600 15px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgba(6,10,18,.55);cursor:default}
.sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:78%;overflow-y:auto;box-sizing:border-box;cursor:default;
  background:var(--glass-strong);border:1px solid var(--line);border-radius:22px 22px 0 0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:18px;padding-bottom:calc(var(--bot) + 18px);display:flex;flex-direction:column;gap:12px;
}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;padding-block:calc(var(--top) + 16px) calc(var(--bot) + 16px);box-sizing:border-box;background:rgba(6,10,18,.62)}
.modal .panel{max-height:100%;overflow-y:auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head .x{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid var(--line);font:700 18px var(--f-cond)}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);font:600 13px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pills span.good{background:rgba(57,217,138,.14);color:var(--stable)}
.pills span.bad{background:rgba(255,90,70,.14);color:var(--danger)}
.pills span.gold{background:rgba(255,194,26,.14);color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:none;padding:7px 12px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid var(--line);font:700 14px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:#111}
.cards{display:grid;gap:8px}
.card{
  display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;min-height:62px;padding:10px 12px;box-sizing:border-box;
  border-radius:14px;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);
}
.card .sw{width:14px;height:40px;border-radius:3px;background:var(--c);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.card b{display:block;font:700 18px var(--f-cond);letter-spacing:.04em;text-transform:uppercase}
.card small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.card .go{font:700 15px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-align:right;white-space:nowrap}
.card[aria-disabled="true"]{cursor:not-allowed;opacity:.62}
.card[aria-disabled="true"] .go{color:var(--danger);text-transform:none;font:500 13px var(--f-body);max-width:14ch;white-space:normal}
.card.done{border-color:rgba(57,217,138,.5);background:rgba(57,217,138,.08)}
.stats{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:15px}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;font:700 17px var(--f-cond);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big div{display:flex;flex-direction:column}
.big b{font:700 38px var(--f-cond);line-height:1;font-variant-numeric:tabular-nums}
.big small{font:600 13px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stars{display:flex;gap:6px;justify-content:center}
.stars i{width:40px;height:40px;background:rgba(255,255,255,.14);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:transform .25s,background .25s}
.stars i.on{background:var(--accent);transform:scale(1.12)}
.stars.small i{width:16px;height:16px}
.stars.small i.on{transform:none}
.rewards{display:flex;gap:10px;flex-wrap:wrap}
.rewards span{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.07);font:700 20px var(--f-cond);letter-spacing:.03em}
.rewards svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:4px 10px;border-radius:999px;background:rgba(255,194,26,.14);color:var(--accent);font:600 13px var(--f-cond);letter-spacing:.08em;text-transform:uppercase}
.note{margin:0;color:var(--stable);font-weight:500}
.note:empty{display:none}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--accent))}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:16px}
.setting small{display:block;color:var(--muted);font-size:13px}
.switch{position:relative;display:inline-block;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.18);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(22px)}
select{font:600 16px var(--f-body);color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
select option{color:#111}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.howto li{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:baseline}
.howto b{font:700 16px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.howto span{font-size:15px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach div{padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.variants{display:flex;gap:6px;margin-top:7px}
.vsw{width:28px;height:28px;border-radius:7px;background:var(--c);border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0;box-shadow:inset 0 4px 0 rgba(255,255,255,.3)}
.vsw.on{border-color:#fff;outline:2px solid var(--accent)}
.vsw[aria-disabled="true"]{opacity:.28;cursor:not-allowed}
.variants.wrap{flex-wrap:wrap}
.studio{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
#stPrev{width:96px;height:330px;border-radius:12px;background:linear-gradient(#27405f,#0f1824)}
.stForm{display:grid;gap:8px;min-width:0}
.stForm .setting{display:flex;flex-direction:column;align-items:stretch;gap:3px;font:600 13px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stForm .setting b{color:var(--ink)}
.stForm select,.stForm input{width:100%;box-sizing:border-box;min-width:0;text-transform:none;letter-spacing:0}
.stForm input[type=range]{accent-color:var(--accent);margin:4px 0}
.stForm input:not([type]){font:600 15px var(--f-body);color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.stForm .vsw{width:24px;height:24px}
.ach.tiers{grid-template-columns:repeat(3,1fr)}
.ach div.on{border-color:rgba(255,194,26,.45);background:rgba(255,194,26,.08)}
.ach b{display:block;font:700 15px var(--f-cond);letter-spacing:.04em;text-transform:uppercase}
.ach small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.ach div:not(.on) b{color:var(--muted)}
.streak{display:flex;align-items:center;gap:10px;font:700 22px var(--f-cond)}
.streak svg{width:28px;height:28px}
.days{display:flex;gap:6px}
.days span{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;background:rgba(255,255,255,.05);font:600 12px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.days span i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.days span.on i{background:var(--accent)}
.days span.today{outline:1px solid var(--accent)}
.toasts{position:absolute;left:50%;top:calc(var(--top) + 116px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
.toast{padding:9px 14px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);font:600 15px var(--f-body);text-align:center;animation:toast 3.2s ease forwards}
.toast.good{border-color:rgba(57,217,138,.5)}
.toast.ach{border-color:rgba(201,168,255,.6)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.lvup{text-align:center;align-items:center}
.lvup .num{font:700 84px/1 var(--f-cond);color:var(--accent)}
.unlocks{display:grid;gap:6px;width:100%}
.unlocks div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);font:600 15px var(--f-body)}
.unlocks div small{color:var(--muted);font:600 13px var(--f-cond);letter-spacing:.08em;text-transform:uppercase}
@media (min-width:760px) and (min-aspect-ratio:1/1){.screen:not(.center){align-items:flex-start;padding-left:48px}}
@media (max-width:480px){
  .stab{padding:7px 10px;gap:6px;font-size:13px;letter-spacing:.06em}
  .stab .segs{display:none}
  .mult{min-width:96px;padding:5px 10px 8px}
  .mult b{font-size:28px}
  .mult span{font-size:11px;letter-spacing:.1em}
  .chip{height:36px;padding:0 9px;font-size:17px}
  .lvl .lbar{display:none}
  .demand{gap:8px;padding:7px 9px;letter-spacing:.05em;flex-wrap:nowrap}
  .dbar .col{width:11px}
  .happy{padding-left:5px}
  .happy b{font-size:16px}
  .lvl{padding-right:6px}
}
@media (max-width:400px){.prestige-chip{display:none}}
@media (prefers-reduced-motion: reduce){.stab[data-level="3"]{animation:none}.banner.show{animation-duration:2.4s}.collect{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Skyline Forge. In the city, drag to pan, pinch or scroll to zoom and tap a lot. While building, tap to drop a floor."></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>

  <!-- City hub -->
  <div class="hub" id="hub" hidden>
    <div class="hub-top">
      <div class="chip glass lvl" id="lvlChip" role="button" tabindex="0" aria-label="City level">
        <span class="ring"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/><circle id="lvlRing" cx="18" cy="18" r="15" fill="none" stroke="#ffc21a" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2"/></svg><b id="lvlNum">1</b></span>
        <span class="lbar"><span id="lvlNext">Level 2 at 40</span><i id="lvlBar"></i></span>
      </div>
      <div class="chip glass" title="Population"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="#e0b060"/><path d="M2.5 19c0-3.4 2.5-6 5.5-6s5.5 2.6 5.5 6z" fill="#c98a2e"/><circle cx="16.5" cy="9" r="2.7" fill="#e0b060"/><path d="M12.6 19c.4-3 2-5 3.9-5 2.6 0 4.5 2.2 4.5 5z" fill="#c98a2e"/></svg><span id="hubPop">0</span></div>
      <div class="chip glass" title="Coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffd257"/><circle cx="12" cy="12" r="6.3" fill="none" stroke="#b8860b" stroke-width="1.6"/><path d="M12 8v8M9.8 10h3.4a1.6 1.6 0 010 3.2h-2.4a1.6 1.6 0 000 3.2h3.4" fill="none" stroke="#8a5f00" stroke-width="1.4"/></svg><span id="hubCoins">0</span></div>
      <div class="chip glass" id="matChip" title="Materials" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4v9l-9 4-9-4z" fill="#b8875a"/><path d="M3 8l9 4 9-4M12 12v9" fill="none" stroke="#6e4a2a" stroke-width="1.5"/><path d="M7.5 6l9 4" stroke="#e0b88a" stroke-width="1.5"/></svg><span id="hubMat">0</span></div>
      <div class="chip glass prestige-chip" title="Prestige"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.6L21.5 9l-5.3 4.5L18 20.5 12 16.8 6 20.5l1.8-7L2.5 9l6.9-.4z" fill="#c9a8ff"/></svg><span id="hubPrestige">0</span></div>
    </div>
    <button class="collect" id="collectBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#fff3c4"/><circle cx="12" cy="12" r="6.3" fill="none" stroke="#8a5f00" stroke-width="1.6"/></svg><span id="collectTxt">Collect 0</span></button>
    <div class="rail">
      <button class="icon-btn glass" id="btnContracts" type="button" aria-label="Contracts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="9" y="2.5" width="6" height="3.5" rx="1" fill="currentColor"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4" stroke="currentColor" stroke-width="1.6"/></svg><span class="badge" id="badgeContracts" hidden>0</span><small>Jobs</small></button>
      <button class="icon-btn glass" id="btnDaily" type="button" aria-label="Daily challenge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4" stroke="currentColor" stroke-width="1.8"/><path d="M12 11.5l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="currentColor"/></svg><span class="badge" id="badgeDaily" hidden>!</span><small>Daily</small></button>
      <button class="icon-btn glass" id="btnRace" type="button" aria-label="Sky Race"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21V6h8v15" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11h8M8 16h8M12 3v3" stroke="currentColor" stroke-width="1.8"/><path d="M4 21h16" stroke="currentColor" stroke-width="1.8"/></svg><small>Race</small></button>
      <button class="icon-btn glass" id="btnTrophies" type="button" aria-label="Trophies"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 01-10 0z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 6H4v1.5A3.5 3.5 0 007.5 11M17 6h3v1.5A3.5 3.5 0 0116.5 11M12 14v3M8 20h8M9.5 17h5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="badge" id="badgeTrophies" hidden>!</span><small>Trophies</small></button>
      <button class="icon-btn glass" id="btnMap" type="button" aria-label="Map overlays"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 4.5-9 4.5-9-4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><small>Map</small></button>
      <button class="icon-btn glass" id="btnMenu" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2"/></svg><small>Menu</small></button>
    </div>
    <div class="hub-bottom">
      <div class="status"><button class="spill glass" id="evPill" type="button" hidden></button><button class="spill glass" id="wxPill" type="button"></button></div>
      <div class="ovkey glass" id="ovKey" hidden><b id="ovName">Land value</b><span id="ovLo">Low</span><i id="ovRamp"></i><span id="ovHi">High</span></div>
      <div class="goal glass" id="goal" role="button" tabindex="0"></div>
      <div class="demand glass" aria-label="Demand">
        <span class="dbar" style="--c:var(--res)"><span class="col"><i id="dR"></i></span>R</span>
        <span class="dbar" style="--c:var(--com)"><span class="col"><i id="dC"></i></span>C</span>
        <span class="dbar" style="--c:var(--off)"><span class="col"><i id="dO"></i></span>O</span>
        <span class="happy">Happy<b id="happy">55%</b></span>
        <span class="happy">Income<b id="income">0/h</b></span>
        <span class="happy" id="gridBox"><span id="gridLbl">Grid</span><b id="grid">OK</b></span>
        <span class="happy" id="trafBox">Roads<b id="traffic">Light</b></span>
      </div>
    </div>
  </div>

  <!-- Construction HUD -->
  <div class="hud" id="hud" hidden>
    <div class="stab glass" id="stab" data-level="0" role="status" aria-live="polite">
      <span class="ico" id="stabIco" aria-hidden="true">●</span><span class="txt" id="stabTxt">Stable</span>
      <span class="segs" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="bpname" id="bpName"></div>
    <div class="mult glass" id="mult" hidden aria-hidden="true">
      <b id="multVal">×1.0</b><span id="multLbl">Safe</span><span class="bar"><i id="multBar"></i></span>
    </div>
    <button class="icon-btn glass" id="pauseBtn" type="button" aria-label="Pause">II</button>
    <div class="coach" id="coach" hidden></div>
    <div class="banner" id="banner" hidden><b id="bannerTitle"></b><span id="bannerSub"></span></div>
    <div class="gauge">
      <span class="gauge-badge" id="hudBadge">0</span>
      <span class="gauge-bar" id="gaugeBar"><i id="gaugeFill"></i></span>
      <span class="gauge-label" id="hudLabel">Floors</span>
    </div>
    <div class="hud-br">
      <div class="combo" id="combo" hidden><span id="comboLabel">Combo ×1</span><div class="combo-bar"><i id="comboFill"></i></div></div>
      <div class="lives" id="lives" aria-label="Lives"></div>
      <span class="hud-pop glass" aria-label="Points">
        <svg viewBox="0 0 11 8" aria-hidden="true"><rect x="1" y="0" width="3" height="3" fill="#e0b060"/><rect x="0" y="3" width="5" height="3" fill="#c98a2e"/><rect x="1" y="6" width="1" height="2" fill="#c98a2e"/><rect x="3" y="6" width="1" height="2" fill="#c98a2e"/><rect x="7" y="0" width="3" height="3" fill="#e0b060"/><rect x="6" y="3" width="5" height="3" fill="#c98a2e"/><rect x="7" y="6" width="1" height="2" fill="#c98a2e"/><rect x="9" y="6" width="1" height="2" fill="#c98a2e"/></svg>
        <span id="hudPop">0</span>
      </span>
    </div>
  </div>

  <!-- Title -->
  <section class="screen" id="title" hidden>
    <div class="panel">
      <p class="eyebrow">Build every tower. Grow your city.</p>
      <h1 class="wordmark">Skyline <span>Forge</span></h1>
      <p class="lede" id="titleLede"></p>
      <div class="btns">
        <button class="btn primary" id="btnPlay" type="button">Play</button>
        <div class="btn-row three">
          <button class="btn" id="btnTitleRace" type="button">Sky Race</button>
          <button class="btn" id="btnTitleDaily" type="button">Daily</button>
          <button class="btn" id="btnTitleSettings" type="button">Settings</button>
        </div>
      </div>
      <p class="best" id="bestLine"></p>
    </div>
  </section>

  <!-- Pause -->
  <section class="screen center" id="pause" hidden>
    <div class="panel">
      <h2>Paused</h2>
      <p class="lede" id="pauseInfo"></p>
      <div class="btns">
        <button class="btn primary" id="btnResume" type="button">Resume</button>
        <div class="btn-row">
          <button class="btn" id="btnRestart" type="button">Restart</button>
          <button class="btn" id="btnPauseSettings" type="button">Settings</button>
        </div>
        <button class="btn ghost" id="btnQuit" type="button">Stop building</button>
      </div>
    </div>
  </section>

  <!-- Results -->
  <section class="screen" id="result" hidden>
    <div class="panel">
      <div>
        <p class="eyebrow" id="resEyebrow"></p>
        <h2 id="resTitle"></h2>
      </div>
      <div class="stars" id="resStars" aria-label="Stars"><i></i><i></i><i></i></div>
      <div class="big">
        <div><b id="resHeight">0</b><small id="resHeightSub">floors</small></div>
        <div><b id="resCap">0</b><small id="resCapSub">residents</small></div>
      </div>
      <div class="rewards" id="resRewards"></div>
      <dl class="stats" id="resStats"></dl>
      <div class="chips" id="resChips"></div>
      <p class="note" id="resNote"></p>
      <div class="btn-row">
        <button class="btn primary" id="resPrimary" type="button"></button>
        <button class="btn" id="resSecondary" type="button"></button>
      </div>
    </div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden><div class="panel" id="modalPanel"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <section class="screen center" id="fatal" hidden>
    <div class="panel"><h2>Can't start</h2><p class="lede" id="fatalText"></p></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/world.js"></script>
<script src="js/life.js"></script>
<script src="js/engine.js"></script>
<script src="js/city.js"></script>
<script src="js/meta.js"></script>
<script src="js/events.js"></script>
<script src="js/stadium.js"></script>
<script src="js/studio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
