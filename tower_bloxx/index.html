<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyline Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0a1230;
  --panel:#13204a;
  --edge:#060a1a;
  --crane:#f5c518;
  --ink:#fff6d6;
  --muted:#aebfe3;
  --good:#8be89a;
  --combo:#ffac00;
  --track:#575659;
  --font-pixel:"Silkscreen","Courier New",ui-monospace,monospace;
  --font-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--night);
  background-image:radial-gradient(circle at 1px 1px,#1a2a5e 1px,transparent 1.5px);background-size:12px 12px;
  color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#stage{
  --u:2px;   /* CSS px per game pixel, set by layout() */
  position:fixed;left:0;width:100%;
  top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);
  overflow:hidden;background:#0a0a0a;touch-action:manipulation;cursor:pointer;
}
#stage.framed{box-shadow:0 0 0 4px var(--edge),0 0 0 8px #22336b,0 0 0 12px var(--edge)}
#view{position:absolute;left:0;top:0;display:block}

/* HUD, laid out like the phone original: combo bar across the top, floor gauge and
   lives bottom-left, population bottom-right. Sizes are in game pixels (--u). */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--font-pixel);font-weight:700;color:#fff}
.outline{text-shadow:1px 1px 0 var(--edge),-1px -1px 0 var(--edge),1px -1px 0 var(--edge),-1px 1px 0 var(--edge),0 1px 0 var(--edge),0 -1px 0 var(--edge),1px 0 0 var(--edge),-1px 0 0 var(--edge)}
.icon-btn{
  pointer-events:auto;position:absolute;top:calc(var(--u) * 6);right:calc(var(--u) * 6);width:calc(var(--u) * 16);height:calc(var(--u) * 16);
  padding:0;display:grid;place-items:center;cursor:pointer;color:var(--ink);
  background:rgba(19,32,74,.7);border:2px solid var(--edge);border-radius:3px;
}
.icon-btn svg{width:62%;height:62%}
.icon-btn .off{display:none}
.icon-btn[aria-pressed="true"] .on{display:none}
.icon-btn[aria-pressed="true"] .off{display:inline}
.combo{position:absolute;left:14.1%;right:14.7%;top:calc(var(--u) * 53)}
.combo-track{height:calc(var(--u) * 6.5);background:var(--track);border-radius:calc(var(--u) * 3.5);overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.combo-track i{display:block;height:100%;width:100%;background:var(--combo);border-radius:inherit}
.combo-x{position:absolute;right:0;bottom:calc(100% + var(--u) * 1);font-size:calc(var(--u) * 6);line-height:1}
.bonus{position:absolute;left:0;right:0;top:calc(var(--u) * 70);text-align:center;font-size:calc(var(--u) * 9);line-height:1;letter-spacing:.04em;animation:blink .24s steps(1) infinite}
@keyframes blink{50%{visibility:hidden}}
@media (prefers-reduced-motion: reduce){.bonus{animation:none}}
.hud-bl{position:absolute;left:calc(var(--u) * 15);bottom:calc(var(--u) * 20);display:flex;align-items:flex-end;gap:calc(var(--u) * 6)}
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge-badge{
  min-width:calc(var(--u) * 13);box-sizing:border-box;padding:calc(var(--u) * 1) calc(var(--u) * 1.5);text-align:center;
  font-size:calc(var(--u) * 6.5);line-height:1;color:#fff;background:#2d8fd6;border:calc(var(--u) * 1) solid #e8f4ff;border-radius:calc(var(--u) * 2);
  box-shadow:0 0 0 1px var(--edge);font-variant-numeric:tabular-nums;
}
.gauge-bar{
  position:relative;width:calc(var(--u) * 7);height:calc(var(--u) * 24);margin-top:calc(var(--u) * -0.5);
  background:#10141c;border:calc(var(--u) * 1) solid #e0b830;border-radius:calc(var(--u) * 1.5);box-shadow:0 0 0 1px var(--edge);
}
.gauge-bar i{position:absolute;left:1px;right:1px;bottom:1px;height:0;background:repeating-linear-gradient(to top,#2d8fd6 0 calc(var(--u) * 1.6),#1b5d92 calc(var(--u) * 1.6) calc(var(--u) * 2.4))}
.lives{display:flex;flex-direction:column;gap:calc(var(--u) * 1.5);margin-bottom:calc(var(--u) * 1)}
.life{width:calc(var(--u) * 7);height:calc(var(--u) * 7);background:#2d8fd6;box-shadow:inset 0 calc(var(--u) * 1) 0 #7cc4f5,0 0 0 1px var(--edge)}
.life.lost{background:#26303f;box-shadow:0 0 0 1px var(--edge)}
.hud-br{position:absolute;right:calc(var(--u) * 14);bottom:calc(var(--u) * 21);display:flex;align-items:center;gap:calc(var(--u) * 2.5)}
.hud-br svg{width:calc(var(--u) * 13);height:calc(var(--u) * 10);filter:drop-shadow(1px 1px 0 var(--edge))}
.hud-pop{font-size:calc(var(--u) * 7.5);line-height:1;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tip{
  position:absolute;left:16px;right:16px;top:74%;margin:0;text-align:center;pointer-events:none;
  font-family:var(--font-pixel);font-size:13px;letter-spacing:.04em;
  text-shadow:2px 2px 0 var(--edge),-1px -1px 0 var(--edge),1px -1px 0 var(--edge),-1px 1px 0 var(--edge);
}

/* Result card */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;
  padding:16px;padding-block:16px 24px;overflow-y:auto;cursor:default;
}
.card{
  width:100%;max-width:380px;box-sizing:border-box;background:var(--panel);border:3px solid var(--edge);
  box-shadow:0 0 0 3px var(--crane),0 0 0 6px var(--edge),8px 10px 0 6px rgba(6,10,26,.5);
  padding:18px;display:flex;flex-direction:column;gap:14px;
}
.eyebrow{margin:0;font-family:var(--font-pixel);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--crane)}
h2{margin:0;font-family:var(--font-pixel);font-weight:700;font-size:26px;line-height:1.05;text-wrap:balance}
.stats{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;font-family:var(--font-pixel);font-weight:700;font-variant-numeric:tabular-nums}
.note{margin:0;color:var(--good);font-size:15px}
.note:empty{display:none}
.btn{
  min-height:48px;padding:10px 14px;cursor:pointer;
  font-family:var(--font-pixel);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  color:#1a1606;background:var(--crane);border:3px solid var(--edge);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.1);
}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.icon-btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" aria-label="Skyline Stack playfield. Tap, click or press Space to drop a floor."></canvas>

  <div id="hud">
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="3" width="2" height="3" fill="currentColor"/><rect x="2" y="2" width="1" height="5" fill="currentColor"/><rect x="3" y="1" width="1" height="7" fill="currentColor"/><g class="on"><rect x="5" y="3" width="1" height="3" fill="currentColor"/><rect x="7" y="2" width="1" height="5" fill="currentColor"/></g><g class="off"><rect x="5" y="3" width="1" height="1" fill="currentColor"/><rect x="6" y="4" width="1" height="1" fill="currentColor"/><rect x="7" y="5" width="1" height="1" fill="currentColor"/><rect x="7" y="3" width="1" height="1" fill="currentColor"/><rect x="5" y="5" width="1" height="1" fill="currentColor"/></g></svg>
    </button>
    <div class="combo" id="combo" hidden>
      <span class="combo-x outline" id="comboLabel"></span>
      <div class="combo-track"><i id="comboFill"></i></div>
    </div>
    <div class="bonus outline" id="bonus" hidden></div>
    <div class="hud-bl">
      <div class="gauge" id="gauge">
        <span class="gauge-badge" id="gaugeBadge">10</span>
        <span class="gauge-bar"><i id="gaugeFill"></i></span>
      </div>
      <div class="lives" id="lives"></div>
    </div>
    <div class="hud-br" aria-label="Residents">
      <svg viewBox="0 0 13 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="4" height="4" fill="#ffb21a"/><rect x="0" y="4" width="6" height="4" fill="#f59a0c"/><rect x="1" y="8" width="1" height="2" fill="#f59a0c"/><rect x="4" y="8" width="1" height="2" fill="#f59a0c"/><rect x="2" y="1" width="1" height="1" fill="#6b3a05"/><rect x="8" y="0" width="4" height="4" fill="#ffb21a"/><rect x="7" y="4" width="6" height="4" fill="#f59a0c"/><rect x="8" y="8" width="1" height="2" fill="#f59a0c"/><rect x="11" y="8" width="1" height="2" fill="#f59a0c"/><rect x="10" y="1" width="1" height="1" fill="#6b3a05"/></svg>
      <span class="hud-pop outline" id="hudPop">00000</span>
    </div>
  </div>
  <p class="tip" id="tip">Tap, click or press Space to drop</p>

  <section id="result" class="screen" hidden>
    <div class="card">
      <p class="eyebrow">Game over</p>
      <h2 id="resTitle">0 floors</h2>
      <dl class="stats" id="resStats"></dl>
      <p class="note" id="resNote"></p>
      <button id="btnAgain" class="btn" type="button">Play again</button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 * Feel tuning. Units are low-res canvas pixels and seconds. The       *
 * motion is measured frame by frame from a 60 fps, 580x1280 phone     *
 * recording of City Bloxx, then scaled by K (a 110 px floor there is  *
 * a 46 px floor here).                                                *
 * ------------------------------------------------------------------ */
const K = 46 / 110;
const CFG = {
  blockW: 40,
  blockH: 46,
  towerTopRatio: 754 / 1280,   // the tower top always comes to rest this far down the screen
  // The rope is a straight line from a fixed pivot far above the screen to the hook. The hook
  // goes round an ellipse (the load circling under the jib, seen from the side): over the top
  // to the left, back along the bottom to the right, its height a quarter turn ahead of its
  // sideways position. The load tilts in proportion to how far the hook is off centre, which is
  // almost three times the rope's own angle. Fitted over 300 frames, residual under 5 px.
  crane: {
    period: 8 / 3,             // seconds per loop; the same on every floor
    rx: 76.7 * K,              // hook: sideways reach
    ry: 44.1 * K,              //       and rise and fall
    above: 331.1 * K,          // ellipse centre, above the tower top
    tilt: 16.8 * Math.PI / 180,// load tilt at the sides (the rope is at 6.2 degrees there)
    pivot: 1032.4 * K,         // rope pivot, above the tower top (off screen)
  },
  gravity: 7200 * K,           // px/s², falling floor
  carry: 0.55,                 // share of the hook's sideways speed a released floor keeps
  straighten: 14,              // a released floor turns level at this rate (1/s)
  perfectTol: 5,               // px from dead centre that still snaps into line
  slabHalf: 52,                // half-width of the concrete slab the first floor must land on
  nextDelay: 0.37,             // landing -> the next floor appears on the hook
  missDelay: 0.72,
  scrollTime: 0.45,            // the camera climbs one floor after a landing, easing out
  parallax: 0.82,              // the city behind moves this much of the camera's climb
  // The tower bends like a mast: the bottom three floors never move, and each floor above them
  // swings a little further than the one below, so the sway grows as the tower climbs.
  sway: {
    period: 2.8,               // seconds per full swing of the building
    fixed: 3,                  // floors that never move
    span: 10,                  // floors above those at which the sway reaches its full size
    power: 1.5,                // how quickly it grows with height
    base: 2.5,                 // px of sway (at full size) even when every floor is dead centre
    comGain: 1.2,              // more per px the floors' average sits off the base
    kick: 0.6,                 // extra per px an off-centre floor lands off, dying down
    kickDecay: 0.6,            // seconds
    max: 36,                   // px, at any floor
    wobble: 0.01,              // radians the newly landed top floor rocks per px it landed off
  },
  residents: 4,                // per clean floor; one fewer per perfectTol px off. The foundation brings none.
  combo: { bar: 413, base: 50, perLevel: 10 },   // the bar drains (base + perLevel * n) of 413 per second
  // Tenants fly in a straight line with both axes easing out together: from just off the screen
  // edge (umbrella top 83 px above the floor top in the recording) to the middle of the floor
  // (umbrella top 38 px below it), where they go inside.
  tenants: { delay: 0.48, time: 2.64, startAbove: 83 * K - 21, end: 38 * K + 21, endX: 2 },
  lives: 3,
};
const OMEGA = 2 * Math.PI / CFG.crane.period;

const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('view'), ctx = canvas.getContext('2d', { alpha: false });
const hud = $('hud');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('en-US');
const pad = (n, d) => String(Math.max(0, Math.round(n))).padStart(d, '0');
const easeOut = k => 1 - (1 - k) * (1 - k);
const pick = list => list[Math.floor(Math.random() * list.length)];

/* ---------------- Pixel helpers ---------------- */
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rect(g, color, x, y, w, h) { g.fillStyle = color; g.fillRect(x, y, w, h); }
function pixLine(g, color, x0, y0, x1, y1, width = 1) {
  const dx = x1 - x0, dy = y1 - y0, steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
  g.fillStyle = color;
  for (let i = 0; i <= steps; i++) g.fillRect(Math.round(x0 + dx * i / steps), Math.round(y0 + dy * i / steps), width, 1);
}
function disc(g, cx, cy, r, color) {
  g.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) { const h = Math.floor(Math.sqrt(r * r - dy * dy)); g.fillRect(cx - h, cy + dy, h * 2 + 1, 1); }
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => clamp(v + amt, 0, 255));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* ---------------- Block sprites (teal, beige window frames, a concrete cap) ---------------- */
const W = CFG.blockW, H = CFG.blockH;
const BLOCK = { body: '#479cab', light: '#72c3cf', dark: '#1a5f6f', outline: '#0e3440', frame: '#a2ae8e', frameDark: '#2c3526', cap: '#a8a89c' };
const GLASS = [['#c9f3fa', 6], ['#8fdbea', 7], ['#52bbd1', 6], ['#3899b3', 4], ['#2a7b93', 3]];   // sky reflection, top to bottom
const HANG = { foundation: 17, floor: 11 };  // rope end -> top of the load: pulley and a two-cable sling, or pulley and hook

function paintGlass(g, x, y, w, h) {
  let yy = y;
  for (const [c, n] of GLASS) { const rows = Math.min(Math.round(n * h / 26), y + h - yy); if (rows > 0) rect(g, c, x, yy, w, rows); yy += rows; }
  if (yy < y + h) rect(g, GLASS[GLASS.length - 1][0], x, yy, w, y + h - yy);
  rect(g, '#f2fdff', x, y + 1, 1, Math.round(h * 0.4));
}
function paintWindow(g, x, y, w, h) {
  rect(g, BLOCK.frameDark, x, y, w, h);
  rect(g, BLOCK.frame, x + 1, y + 1, w - 2, h - 2);
  rect(g, shade(BLOCK.frame, 28), x + 1, y + 1, w - 2, 1);
  rect(g, BLOCK.frameDark, x + 2, y + 2, w - 4, h - 4);
  paintGlass(g, x + 3, y + 3, w - 6, h - 6);
}
function paintBlock(g, t, door) {
  rect(g, t.outline, 0, 0, W, H);
  rect(g, t.body, 1, 1, W - 2, H - 2);
  rect(g, t.light, 1, 5, 2, H - 9);
  rect(g, t.dark, W - 4, 4, 3, H - 5);                // shaded side
  rect(g, t.dark, 1, H - 4, W - 2, 3);                // shaded underside
  rect(g, shade(t.cap, 30), 1, 1, W - 2, 1);          // concrete floor slab along the top
  rect(g, t.cap, 1, 2, W - 2, 2);
  rect(g, shade(t.cap, -40), 1, 4, W - 2, 1);
  if (door) {
    paintWindow(g, 7, 8, 26, H - 11);
    rect(g, BLOCK.frame, 9, 16, 22, 2);               // transom bar
    rect(g, BLOCK.frameDark, 19, 18, 2, H - 21);      // between the door leaves
    rect(g, '#e6ecd5', 17, 29, 1, 3); rect(g, '#e6ecd5', 22, 29, 1, 3);
  } else {
    for (const x of [6, 22]) paintWindow(g, x, 8, 12, 31);
  }
}
const SPR = {};
for (const kind of ['floor', 'foundation']) {
  SPR[kind] = canvasOf(W, H);
  paintBlock(SPR[kind].getContext('2d'), BLOCK, kind === 'foundation');
}

/* ---------------- Scenery ---------------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(2005);
const clouds = Array.from({ length: 34 }, () => ({ ly: -600 - rand() * 2000, bx: rand() * 2400, w: 18 + Math.floor(rand() * 30), sp: 2 + rand() * 5, puff: rand() < 0.5 }));
const stars = Array.from({ length: 150 }, () => ({ x: Math.floor(rand() * 320), y: Math.floor(rand() * 320), big: rand() < 0.1, ph: rand() * 6.28 }));
const rocks = Array.from({ length: 22 }, () => ({ x: Math.round(rand() * 560 - 280), y: 8 + Math.round(rand() * 56), s: 2 + Math.floor(rand() * 4) }));

// Big flat city blocks behind the site, with sky showing between them.
function makeBackdrop(pal, minW, maxW, minH, maxH, detail, glass) {
  const arr = []; let total = 0;
  while (total < 720) {
    const b = {
      w: minW + Math.floor(rand() * (maxW - minW)), h: minH + Math.floor(rand() * (maxH - minH)),
      gap: rand() < 0.3 ? 3 : 0, c: pal[Math.floor(rand() * pal.length)],
      kind: ['bands', 'glass', 'grid', 'bands', 'plain'][Math.floor(rand() * 5)], cap: rand() < 0.35, gx: rand(),
    };
    arr.push(b); total += b.w + b.gap;
  }
  const tall = maxH + 12, c = canvasOf(total, tall), g = c.getContext('2d');
  let x = 0;
  for (const b of arr) {
    const top = tall - b.h;
    rect(g, b.c, x, top, b.w, b.h);
    if (b.cap) rect(g, shade(b.c, -12), x + 5, top - 8, Math.round(b.w * 0.4), 8);
    if (b.kind === 'bands') for (let y = top + 14; y < tall - 8; y += 22) rect(g, shade(b.c, -20 * detail), x, y, b.w, 6);
    if (b.kind === 'glass') { const gw = Math.min(14, b.w - 10), gx = x + 4 + Math.floor(b.gx * (b.w - gw - 8)); rect(g, glass, gx, top + 6, gw, b.h - 8); rect(g, shade(glass, 18), gx, top + 6, 3, b.h - 8); }
    if (b.kind === 'grid') for (let y = top + 8; y < tall - 8; y += 9) for (let xx = x + 4; xx < x + b.w - 6; xx += 7) rect(g, shade(b.c, -26 * detail), xx, y, 3, 4);
    rect(g, shade(b.c, 16), x, top, b.w, 2);
    rect(g, shade(b.c, -14), x + b.w - 3, top, 3, b.h);
    rect(g, b.c, x, tall - 2, b.w - 3, 2);
    x += b.w + b.gap;
  }
  return { img: c, total, tall };
}
const FAR = makeBackdrop(['#b9c3cc', '#c7cfd7', '#adb8c2', '#c0c8cf'], 24, 60, 220, 520, 0.5, '#c4dcee');
const NEAR = makeBackdrop(['#a4abaa', '#b8bdbc', '#a39392', '#c9cccb', '#9aa1a0', '#8f9392'], 40, 110, 500, 1300, 0.8, '#add6ef');

const meshTile = canvasOf(6, 6);
{ const g = meshTile.getContext('2d'); for (let i = 0; i < 6; i++) { rect(g, '#b9b9b9', i, i, 1, 1); rect(g, '#b9b9b9', 5 - i, i, 1, 1); } }
const MESH = ctx.createPattern(meshTile, 'repeat');

const SKY = [
  [0,    [0x9f, 0xcf, 0xee], [0xc9, 0xe6, 0xf6]],
  [1400, [0x3f, 0x8f, 0xd6], [0x9e, 0xd2, 0xf0]],
  [2600, [0x28, 0x47, 0x9a], [0x6d, 0x8f, 0xd0]],
  [3600, [0x12, 0x1c, 0x4a], [0x2c, 0x3d, 0x80]],
  [4800, [0x05, 0x08, 0x1a], [0x0e, 0x15, 0x36]],
];
const mix = (a, b, t) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function skyAt(alt) {
  if (alt <= SKY[0][0]) return [SKY[0][1], SKY[0][2]];
  for (let i = 1; i < SKY.length; i++) {
    if (alt <= SKY[i][0]) { const a = SKY[i - 1], b = SKY[i], t = (alt - a[0]) / (b[0] - a[0]); return [mix(a[1], b[1], t), mix(a[2], b[2], t)]; }
  }
  const l = SKY[SKY.length - 1]; return [l[1], l[2]];
}

/* ---------------- View and framing (the recording's 580x1280 phone screen) ---------------- */
// The screen is always 242 game pixels wide, the recording's 580 px, so the tower, crane and
// tenants take up the same share of it on every device. The canvas draws each game pixel as a
// whole number of backing pixels and the browser scales that down to fit.
const ASPECT = 580 / 1280, VIEW_W = Math.round(580 * K);
const view = { w: VIEW_W, h: 535, scale: 1, m: 1 };
let RIG = null;
function layout() {
  const vw = window.innerWidth;
  const sh = stage.clientHeight || window.innerHeight;
  const framed = vw / sh > 0.62;
  const sw = framed ? Math.round(sh * ASPECT) : vw;
  stage.style.width = sw + 'px';
  stage.style.left = Math.round((vw - sw) / 2) + 'px';
  stage.classList.toggle('framed', framed);
  const dpr = window.devicePixelRatio || 1;
  view.scale = sw / VIEW_W;                                 // CSS px per game pixel
  view.w = VIEW_W; view.h = Math.ceil(sh / view.scale);
  view.m = Math.max(1, Math.ceil(view.scale * dpr));        // backing px per game pixel
  canvas.width = view.w * view.m; canvas.height = view.h * view.m;
  canvas.style.width = sw + 'px';
  canvas.style.height = (view.h * view.scale) + 'px';
  stage.style.setProperty('--u', view.scale + 'px');
  ctx.imageSmoothingEnabled = false;
  const topScreen = Math.round(view.h * CFG.towerTopRatio);
  RIG = { topScreen, hookY: topScreen - CFG.crane.above, pivotY: topScreen - CFG.crane.pivot };
}

/* ---------------- Save (best tower and the mute switch) ---------------- */
const SAVE_KEY = 'skyline-stack/v1';
const save = { best: { floors: 0, pop: 0 }, muted: false };
function readSave() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return d && typeof d === 'object' ? d : {}; }
  catch (e) { return {}; }
}
function load() {
  const d = readSave();
  if (d.best) save.best = { floors: +d.best.floors || 0, pop: +d.best.pop || 0 };
  save.muted = !!d.muted;
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...readSave(), best: save.best, muted: save.muted })); }
  catch (e) { /* storage unavailable: play without saving */ }
}

/* ---------------- Sound (square-wave blips) ---------------- */
const Sound = {
  ctx: null, muted: false,
  ensure() {
    if (this.muted) return;
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* no audio */ }
  },
  tone(freq, dur, { type = 'square', vol = 0.06, slide = 0, delay = 0 } = {}) {
    if (this.muted || !this.ctx) return;
    try {
      const c = this.ctx, t0 = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* ignore */ }
  },
  release() { this.tone(760, 0.05, { vol: 0.03, slide: 520 }); },
  land() { this.tone(160, 0.09, { vol: 0.09, slide: 70 }); this.tone(90, 0.07, { type: 'triangle', vol: 0.08 }); },
  perfect(n) { const b = 660 + Math.min(n, 6) * 60; [1, 1.26, 1.5].forEach((m, i) => this.tone(b * m, 0.08, { vol: 0.05, delay: i * 0.06 })); },
  bonus() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.09, { vol: 0.045, delay: i * 0.07 })); },
  miss() { this.tone(420, 0.4, { type: 'sawtooth', vol: 0.045, slide: 70 }); },
  over() { [392, 330, 262].forEach((f, i) => this.tone(f, 0.18, { vol: 0.05, delay: i * 0.14 })); },
};

/* ---------------- Game state ---------------- */
let state = 'play';         // play | result
let game = null;
let sceneTime = 0;

function newGame() {
  const g = {
    tower: [], lives: CFG.lives, pop: 0, perfects: 0, maxCombo: 0,
    combo: { n: 0, left: 0 },            // left: share of the bar still full
    phase: game ? game.phase : Math.PI / 2,
    hook: { has: true, wait: 0 },
    falling: null, debris: [], parts: [], tenants: [], bursts: [], twinkles: [], twinkleT: 0,
    sway: { phase: 0, amp: CFG.sway.base, target: CFG.sway.base, kick: 0 },
    wobble: null,
    camY: 0, cam: null, bonusT: 0,
    ending: null, pan: null, hold: false, finished: false,
  };
  g.camY = cameraTarget(g);
  return g;
}

const cameraTarget = g => -g.tower.length * H - RIG.topScreen;
const nextKind = g => (g.tower.length === 0 ? 'foundation' : 'floor');

// The crane hangs from the screen, not the world: the hook circles its ellipse at the same
// height while the camera climbs. Returns the hook point in screen pixels, its velocity and
// the tilt of whatever hangs from it.
function hookAt(g) {
  const c = CFG.crane, s = Math.sin(g.phase), co = Math.cos(g.phase);
  return {
    x: view.w / 2 - c.rx * s, y: RIG.hookY - c.ry * co, tilt: c.tilt * s,
    vx: -c.rx * OMEGA * co, vy: c.ry * OMEGA * s,
  };
}

// The building bends like a mast. Floors are stored where they landed on a still tower; the
// sway shifts each height sideways by bendAt(), which is zero up to the top of the third floor
// and grows the higher you go.
function bendShape(y) {                  // y: height above the ground, in floors
  const S = CFG.sway;
  return y <= S.fixed ? 0 : Math.pow((y - S.fixed) / S.span, S.power);
}
function bendAt(g, y) {
  const S = CFG.sway, d = (g.sway.amp + g.sway.kick) * Math.sin(g.sway.phase) * bendShape(y);
  return clamp(d, -S.max, S.max);
}
function bent(g, x, y) { return { x: x + bendAt(g, -y / H), y }; }   // a point on the still tower, moved into place
function towerTop(g) {
  const n = g.tower.length;
  if (!n) return { x: 0, y: 0 };
  return { x: g.tower[n - 1].x + bendAt(g, n), y: -n * H };
}
// A floor that lands off centre rocks on the one below for a moment before it settles.
function wobbleAngle(g) {
  const w = g.wobble;
  return w ? w.a * Math.exp(-w.t / 0.2) * Math.cos(2 * Math.PI * w.t / 0.3) : 0;
}

function drop() {
  const g = game;
  if (state !== 'play' || !g.hook.has || g.falling || g.ending) return;
  const h = hookAt(g), kind = nextKind(g), d = HANG[kind] + H / 2;
  // the centre of the load, which hangs tilted below the hook point
  const sx = h.x - d * Math.sin(h.tilt), sy = h.y + d * Math.cos(h.tilt);
  g.falling = { x: sx - view.w / 2, y: sy + g.camY, vx: h.vx * CFG.carry, vy: h.vy, ang: h.tilt, kind };
  g.hook.has = false;
  $('tip').hidden = true;
  Sound.release();
}

function stepFalling(g, dt) {
  const b = g.falling;
  b.vy += CFG.gravity * dt; b.x += b.vx * dt; b.y += b.vy * dt;
  b.ang *= Math.exp(-CFG.straighten * dt);
  const n = g.tower.length, top = towerTop(g);
  if (b.y + H / 2 < top.y) return;
  b.y = top.y - H / 2;
  if (n === 0) {
    if (Math.abs(b.x) > CFG.slabHalf) {
      g.falling = null;
      g.debris.push({ state: 'wreck', x: b.x, y: -H / 2, ang: 0, t: 0.9, kind: b.kind });
      dust(g, b.x, 0, 14);
      loseLife(g);
      return;
    }
    settle(g, b, b.x);
    return;
  }
  const dx = b.x - top.x;
  if (Math.abs(dx) >= W) {                       // clean miss: keeps falling past the tower
    g.falling = null;
    g.debris.push({ state: 'fall', x: b.x, y: b.y, vx: b.vx, vy: b.vy, ang: b.ang, spin: Math.sign(dx) * 1.5, kind: b.kind });
    loseLife(g);
  } else if (Math.abs(dx) > W / 2) {             // centre past the edge: tips over the side
    const sgn = Math.sign(dx), ex = top.x + sgn * W / 2;
    g.falling = null;
    g.debris.push({ state: 'tip', x: b.x, y: b.y, ang: 0, av: 0, sgn, px: ex, py: top.y, rx: b.x - ex, ry: -H / 2, kind: b.kind });
    loseLife(g);
  } else {
    settle(g, b, dx);
  }
}

function settle(g, b, dx) {
  const n = g.tower.length;
  const perfect = Math.abs(dx) <= CFG.perfectTol;
  if (perfect) dx = 0;
  const x = n === 0 ? dx : g.tower[n - 1].x + dx;
  g.tower.push({ x, kind: b.kind });
  g.falling = null;

  // Residents move in the moment the floor lands; the tenants flying over are the show.
  const residents = n === 0 ? 0 : Math.max(1, CFG.residents - Math.floor(Math.abs(dx) / CFG.perfectTol));
  g.pop += residents;

  // Combo: a perfect floor starts it or refills the bar; every floor that lands while it
  // runs raises the multiplier. The bar drains faster at each level.
  const c = g.combo;
  if (c.n > 0) { c.n++; if (perfect) c.left = 1; }
  else if (perfect) { c.n = 1; c.left = 1; }
  if (c.n) g.maxCombo = Math.max(g.maxCombo, c.n);
  if (perfect) g.perfects++;

  // Sway: the floors' average offset keeps the building rocking harder; an off-centre landing
  // adds a swing that dies down, and the new floor rocks on the one below for a moment.
  const s = g.sway, p0 = g.tower[0].x;
  const com = g.tower.reduce((sum, f) => sum + f.x - p0, 0) / g.tower.length;
  s.target = Math.min(CFG.sway.max, CFG.sway.base + CFG.sway.comGain * Math.abs(com));
  if (!perfect && n > 0) {
    s.kick = Math.min(CFG.sway.max, s.kick + Math.abs(dx) * CFG.sway.kick);
    g.wobble = { a: clamp(dx * CFG.sway.wobble, -0.08, 0.08), t: 0 };
  }

  const top = towerTop(g);
  if (perfect) { starBurst(g, top); Sound.perfect(c.n); }
  Sound.land();
  moveIn(g, n);

  g.cam = { from: g.camY, to: cameraTarget(g), t: 0 };
  g.hook.wait = CFG.nextDelay;
  updateHud();
}

function loseLife(g) {
  g.lives--;
  g.combo.n = 0; g.combo.left = 0;
  Sound.miss();
  if (g.lives <= 0) { g.ending = { t: 1.1 }; setTimeout(() => Sound.over(), 500); }
  else g.hook.wait = CFG.missDelay;
  updateHud();
}

function stepCombo(g, dt) {
  const c = g.combo;
  if (!c.n) return;
  c.left -= (CFG.combo.base + CFG.combo.perLevel * c.n) / CFG.combo.bar * dt;
  if (c.left > 0) return;
  const bonus = c.n * (c.n + 1);             // x6 pays 42, x3 pays 12
  g.pop += bonus;
  c.n = 0; c.left = 0;
  g.bonusT = 1.3;
  $('bonus').textContent = '+' + pad(bonus, 3);
  Sound.bonus();
  updateHud();
}

function stepDebris(g, d, dt) {
  if (d.state === 'tip') {
    d.av += d.sgn * 18 * dt; d.ang += d.av * dt;
    const c = Math.cos(d.ang), s = Math.sin(d.ang);
    d.x = d.px + d.rx * c - d.ry * s; d.y = d.py + d.rx * s + d.ry * c;
    if (Math.abs(d.ang) > 0.9) { d.state = 'fall'; d.vx = d.sgn * 70; d.vy = 40; d.spin = d.av; }
  } else if (d.state === 'fall') {
    d.vy += CFG.gravity * 0.8 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.ang += d.spin * dt;
    if (d.y + H / 2 >= 0) { d.state = 'wreck'; d.y = -H / 2; d.ang = 0; d.t = 0.8; dust(g, d.x, 0, 12); }
  } else {
    d.t -= dt;
  }
}

function dust(g, x, y, count) {
  const n = reduceMotion ? Math.ceil(count / 3) : count;
  for (let i = 0; i < n; i++) g.parts.push({ x: x + (Math.random() - 0.5) * 6, y: y - 1, vx: (Math.random() - 0.5) * 90, vy: -(15 + Math.random() * 45), t: 0, life: 0.35 + Math.random() * 0.25, c: '#efe8d6', s: Math.random() < 0.3 ? 2 : 1, g: 380 });
}

/* ---------------- Perfect stars and combo twinkles ---------------- */
// A perfect floor throws a star off each corner, trailing a thin line back to where it started.
function starBurst(g, top) {
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    g.bursts.push({ x0: top.x + sx * W / 2, y0: top.y + (sy < 0 ? 2 : H - 2), dx: sx * Math.SQRT1_2, dy: sy * Math.SQRT1_2, t: 0, life: 0.55, dist: 62 });
  }
}
function drawStar(x, y) {
  const O = '#d86a00', Y = '#ffd21f', L = '#fff6a8';
  rect(ctx, O, x - 1, y - 4, 3, 1); rect(ctx, O, x - 4, y - 1, 9, 1); rect(ctx, O, x - 3, y + 2, 7, 1); rect(ctx, O, x - 3, y + 3, 2, 1); rect(ctx, O, x + 2, y + 3, 2, 1);
  rect(ctx, Y, x, y - 3, 1, 1); rect(ctx, Y, x - 1, y - 2, 3, 1); rect(ctx, Y, x - 3, y, 7, 2); rect(ctx, Y, x - 2, y + 2, 5, 1); rect(ctx, Y, x - 1, y - 1, 3, 1);
  rect(ctx, L, x, y - 1, 1, 2);
}
// While a combo runs, glints wink on and off along the edges of the top two floors.
function stepTwinkles(g, dt) {
  for (const k of g.twinkles) k.t += dt;
  g.twinkles = g.twinkles.filter(k => k.t < k.life);
  if (!g.combo.n || !g.tower.length || reduceMotion) return;
  g.twinkleT -= dt;
  if (g.twinkleT > 0) return;
  g.twinkleT = 0.09 + Math.random() * 0.12;
  const n = g.tower.length, i = n - 1 - (n > 1 && Math.random() < 0.35 ? 1 : 0), f = g.tower[i];
  const side = Math.floor(Math.random() * 3);           // left edge, right edge or the roof line
  const lx = side === 0 ? f.x - W / 2 : side === 1 ? f.x + W / 2 : f.x + (Math.random() - 0.5) * W;
  const ly = -(i + 1) * H + (side === 2 ? 0 : Math.random() * H);
  g.twinkles.push({ floor: i, lx, ly, t: 0, life: 0.18 + Math.random() * 0.12, big: Math.random() < 0.5 });
}
function drawTwinkle(x, y, big) {
  rect(ctx, '#ffffff', x, y, 1, 1);
  for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    rect(ctx, '#ffe34a', x + a, y + b, 1, 1);
    if (big) rect(ctx, '#ffd21f', x + 2 * a, y + 2 * b, 1, 1);
  }
}

/* ---------------- Tenants ---------------- */
// Measured from the recording at 60 fps: 0.48 s after a floor lands, one tenant sets off from
// just beyond each edge of the screen under a red or blue umbrella. Each flies a straight line,
// sideways and down together, fast at first (about 210 and 92 px/s there) and slowing evenly to
// a stop (an ease-out) 2.64 s later, passing the windows and meeting the other in the middle of
// the floor, where they go inside. The tenant swings a little under the umbrella.
const UMBRELLAS = [['#a81818', '#5c0a0a', '#e0463a'], ['#1b2f9a', '#0b1660', '#4a6ad8']];
const SHIRTS = ['#3f8f2f', '#c8a038', '#3a64b8', '#b84a3a'];
const SKIN = ['#e8b07a', '#c98a5a'];
function moveIn(g, floor) {
  const T = CFG.tenants;
  for (const side of [-1, 1]) {
    g.tenants.push({
      floor, endX: side * T.endX,
      sx: side * (view.w / 2 + 3), sy: -(floor + 1) * H - T.startAbove,   // umbrella centre, feet
      t: -T.delay - Math.random() * 0.03, dur: T.time, ph: Math.random() * 6.28,
      umbrella: pick(UMBRELLAS), shirt: pick(SHIRTS), skin: pick(SKIN),
    });
  }
}
function tenantPos(g, p) {
  const f = g.tower[p.floor];
  const end = bent(g, f.x + p.endX, -(p.floor + 1) * H + CFG.tenants.end);
  const e = easeOut(clamp(p.t / p.dur, 0, 1));
  return { x: p.sx + (end.x - p.sx) * e, y: p.sy + (end.y - p.sy) * e };
}
function drawTenant(p, x, y) {   // x: the umbrella's centre column; y: the screen row under the feet
  const [dome, rim, hi] = p.umbrella, trousers = '#a8561e';
  const sw = Math.round(Math.sin(p.t * 5 + p.ph) * 1.2), px = x + sw - 1;   // the tenant swings under the umbrella
  rect(ctx, '#2a1a1a', x, y - 22, 1, 1);          // tip
  rect(ctx, dome, x - 2, y - 21, 5, 1);
  rect(ctx, dome, x - 4, y - 20, 9, 1);
  rect(ctx, dome, x - 5, y - 19, 11, 2);
  rect(ctx, hi, x - 3, y - 20, 2, 1); rect(ctx, hi, x - 4, y - 19, 1, 1);
  rect(ctx, rim, x - 5, y - 17, 11, 1);
  for (const k of [-5, -1, 3]) rect(ctx, rim, x + k, y - 16, 2, 1);   // scalloped edge
  pixLine(ctx, '#1a1a1a', x, y - 16, px + 1, y - 12);                 // handle
  rect(ctx, p.skin, px + 1, y - 12, 1, 3);        // raised arm
  rect(ctx, p.skin, px - 1, y - 11, 2, 2);        // head
  rect(ctx, p.shirt, px - 1, y - 9, 3, 4);        // shirt
  rect(ctx, trousers, px - 1, y - 5, 3, 2);
  rect(ctx, trousers, px - 1, y - 3, 1, 2); rect(ctx, trousers, px + 1, y - 3, 1, 2);   // legs
  rect(ctx, '#2a1a10', px - 1, y - 1, 1, 1); rect(ctx, '#2a1a10', px + 1, y - 1, 1, 1);  // shoes
}

/* ---------------- Update ---------------- */
function update(dt) {
  const g = game;
  g.phase += OMEGA * dt;

  if (!g.hook.has && !g.falling && !g.ending) {
    g.hook.wait -= dt;
    if (g.hook.wait <= 0) g.hook.has = true;     // the next floor appears on the hook
  }

  const s = g.sway;
  s.phase += dt * 2 * Math.PI / CFG.sway.period;
  s.amp += (s.target - s.amp) * Math.min(1, dt * 1.5);
  s.kick *= Math.exp(-dt / CFG.sway.kickDecay);
  if (g.wobble && (g.wobble.t += dt) > 0.8) g.wobble = null;

  if (state === 'play') stepCombo(g, dt);
  if (g.bonusT > 0) g.bonusT -= dt;

  if (g.falling) stepFalling(g, dt);
  for (const d of g.debris) stepDebris(g, d, dt);
  g.debris = g.debris.filter(d => (d.state === 'wreck' ? d.t > 0 : d.y - g.camY < view.h + 120));
  for (const p of g.parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.t += dt; }
  g.parts = g.parts.filter(p => p.t < p.life);
  for (const p of g.tenants) p.t += dt;
  g.tenants = g.tenants.filter(p => p.t < p.dur);
  for (const b of g.bursts) b.t += dt;
  g.bursts = g.bursts.filter(b => b.t < b.life);
  stepTwinkles(g, dt);

  if (g.pan) {
    const d = g.pan.to - g.camY, step = g.pan.speed * dt;
    if (Math.abs(d) <= step) { g.camY = g.pan.to; g.pan = null; g.hold = true; finishRound(g); }
    else g.camY += Math.sign(d) * step;
  } else if (g.cam) {
    g.cam.t += dt;
    const k = Math.min(1, g.cam.t / CFG.scrollTime);
    g.camY = g.cam.from + (g.cam.to - g.cam.from) * easeOut(k);
    if (k >= 1) g.cam = null;
  }

  if (g.ending && !g.ending.started) {
    g.ending.t -= dt;
    if (g.ending.t <= 0 && !g.falling) { g.ending.started = true; startPan(g); }
  }
}

// After the round, the camera slides back down the whole tower to the street,
// which ends just above the results card.
const endCam = () => -Math.round(view.h * 0.55);
function startPan(g) {
  g.cam = null;
  const to = endCam(), dist = Math.abs(to - g.camY);
  if (dist < 4) { g.hold = true; finishRound(g); return; }
  g.pan = { to, speed: Math.max(260, dist / 1.8) };
}

/* ---------------- Rendering ---------------- */
function drawSky(alt) {
  const [top, bot] = skyAt(alt), bands = 16, bh = Math.ceil(view.h / bands);
  for (let i = 0; i < bands; i++) rect(ctx, rgb(mix(top, bot, i / (bands - 1))), 0, i * bh, view.w, bh);
}
function drawStars(alt, camY) {
  const a = clamp((alt - 1800) / 1600, 0, 1);
  if (a <= 0) return;
  const oy = Math.floor(-camY * 0.08);
  ctx.fillStyle = '#ffffff';
  for (let ty = 0; ty < view.h + 320; ty += 320) {
    for (let tx = 0; tx < view.w; tx += 320) {
      for (const s of stars) {
        const x = tx + s.x, y = ty + ((s.y + oy) % 320) - 320;
        if (x >= view.w || y < 0 || y >= view.h) continue;
        ctx.globalAlpha = a * (s.big ? 1 : 0.55 + 0.45 * Math.sin(sceneTime * 2.2 + s.ph));
        ctx.fillRect(x, y, 1, 1);
        if (s.big) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
      }
    }
  }
  ctx.globalAlpha = 1;
}
function discBands(cx, cy, r, colorAt) {
  for (let dy = -r; dy <= r; dy++) { const h = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillStyle = colorAt(dy); ctx.fillRect(cx - h, cy + dy, h * 2 + 1, 1); }
}
function drawSpace(alt, camY) {
  if (alt < 1800) return;
  const mx = Math.round(view.w * 0.8), my = Math.round(-260 - camY * 0.1);
  if (my > -20 && my < view.h + 20) {
    disc(ctx, mx, my, 12, '#e6e2d3');
    disc(ctx, mx - 4, my - 3, 3, '#c9c4b2'); disc(ctx, mx + 5, my + 4, 2, '#c9c4b2'); disc(ctx, mx + 2, my - 6, 1, '#c9c4b2');
  }
  const sx = Math.round(view.w * 0.2), sy = Math.round(-420 - camY * 0.1);
  if (sy > -30 && sy < view.h + 30) {
    const ring = side => { ctx.fillStyle = '#cdb57a'; for (let dx = -22; dx <= 22; dx++) ctx.fillRect(sx + dx, sy + side * Math.round(Math.sqrt(1 - (dx / 22) ** 2) * 4), 1, 1); };
    ring(-1);
    discBands(sx, sy, 9, dy => (dy % 4 === 0 ? '#c9a86a' : '#e3c68a'));
    ring(1);
  }
  const jx = Math.round(view.w * 0.66), jy = Math.round(-600 - camY * 0.1), jr = 26;
  if (jy > -40 && jy < view.h + 40) {
    const bands = ['#e9d6b3', '#c99a6b', '#f1e3c9', '#b7794d', '#ecd9b8', '#c28e61', '#e9d6b3'];
    discBands(jx, jy, jr, dy => bands[Math.min(bands.length - 1, Math.floor((dy + jr) / (2 * jr + 1) * bands.length))]);
    rect(ctx, '#b8503a', jx + 6, jy + 7, 8, 4); rect(ctx, '#b8503a', jx + 7, jy + 6, 6, 6);
  }
}
function drawClouds(alt, camY) {
  const fade = 1 - clamp((alt - 2600) / 800, 0, 1);
  if (fade <= 0) return;
  const RW = view.w + 140;
  ctx.globalAlpha = fade;
  for (const c of clouds) {
    const sy = Math.round(c.ly - camY * 0.55);
    if (sy < -12 || sy > view.h + 10) continue;
    const sx = Math.round((((c.bx + c.sp * sceneTime) % RW) + RW) % RW - 70);
    rect(ctx, '#ffffff', sx, sy, c.w, 6);
    rect(ctx, '#ffffff', sx + 4, sy - 4, Math.floor(c.w * 0.45), 4);
    rect(ctx, '#ffffff', sx + Math.floor(c.w * 0.4), sy - 7, Math.floor(c.w * 0.35), 7);
    if (c.puff) rect(ctx, '#ffffff', sx + c.w - 10, sy - 3, 8, 3);
    rect(ctx, '#d3e9f5', sx + 2, sy + 6, c.w - 4, 2);
  }
  ctx.globalAlpha = 1;
}
function drawBackdrop(layer, camY, p) {
  const base = Math.round(-camY * p + (1 - p) * RIG.topScreen);
  if (base - layer.tall > view.h) return;
  const x0 = Math.round(view.w / 2) - layer.total * Math.ceil(view.w / 2 / layer.total + 1);
  for (let x = x0; x < view.w; x += layer.total) {
    ctx.drawImage(layer.img, x, base - layer.tall);
    if (base < view.h) ctx.drawImage(layer.img, 0, layer.tall - 1, layer.total, 1, x, base, layer.total, view.h - base);
  }
}
function cone(x, yb) {
  rect(ctx, '#2a1a10', x - 4, yb - 1, 9, 2);
  rect(ctx, '#e8452c', x - 3, yb - 3, 7, 2);
  rect(ctx, '#ffffff', x - 2, yb - 5, 5, 2);
  rect(ctx, '#e8452c', x - 2, yb - 7, 5, 2);
  rect(ctx, '#e8452c', x - 1, yb - 9, 3, 2);
  rect(ctx, '#ffd0c4', x, yb - 10, 1, 1);
}
function drawGround(camY) {
  const gy = Math.round(-camY);
  if (gy - 80 > view.h) return;
  const cx = Math.round(view.w / 2), S = CFG.slabHalf, back = gy - 6;

  // chain-link fence with a hedge behind it, left of the site
  const leftEnd = cx - S - 8, fTop = back - 26;
  if (leftEnd > 0) {
    rect(ctx, '#4f7f45', 0, back - 16, leftEnd, 16);
    for (let x = 0; x < leftEnd; x += 6) rect(ctx, '#6e9c62', x, back - 18, 4, 2);
    ctx.save(); ctx.translate(0, fTop); ctx.fillStyle = MESH; ctx.fillRect(0, 0, leftEnd, 26); ctx.restore();
    rect(ctx, '#d0d0d0', 0, fTop, leftEnd, 1); rect(ctx, '#7a7a7a', 0, fTop + 1, leftEnd, 1);
    for (let x = leftEnd - 3; x > -3; x -= 22) { rect(ctx, '#5e5e5e', x, fTop - 2, 3, 28); rect(ctx, '#a8a8a8', x, fTop - 2, 1, 28); }
  }

  // tree and wooden hoarding, right of the site
  const rs = cx + S + 10, wTop = back - 30, tx = cx + S + 50;
  rect(ctx, '#3b2716', tx - 2, back - 40, 5, 40);
  disc(ctx, tx, back - 50, 17, '#1f4a1c');
  disc(ctx, tx - 10, back - 44, 11, '#2c6526'); disc(ctx, tx + 11, back - 45, 12, '#2c6526'); disc(ctx, tx + 1, back - 58, 12, '#2c6526');
  disc(ctx, tx - 5, back - 57, 6, '#3f8a36'); disc(ctx, tx - 12, back - 47, 5, '#3f8a36'); disc(ctx, tx + 7, back - 52, 5, '#3f8a36');
  rect(ctx, '#6dbb58', tx - 7, back - 61, 2, 2); rect(ctx, '#6dbb58', tx + 5, back - 55, 2, 1);
  if (rs < view.w) {
    for (let x = rs; x < view.w; x += 5) { rect(ctx, '#c9a45e', x, wTop, 4, 30); rect(ctx, '#9a7a3e', x + 4, wTop, 1, 30); rect(ctx, '#e2c888', x, wTop, 4, 1); }
    rect(ctx, '#b08e4c', rs, wTop + 8, view.w - rs, 2); rect(ctx, '#b08e4c', rs, wTop + 21, view.w - rs, 2);
    rect(ctx, '#1a1a1a', rs + 12, wTop + 10, 16, 9); rect(ctx, '#f0d23a', rs + 13, wTop + 11, 14, 7);
    rect(ctx, '#1a1a1a', rs + 15, wTop + 13, 4, 1); rect(ctx, '#1a1a1a', rs + 21, wTop + 13, 4, 1); rect(ctx, '#1a1a1a', rs + 15, wTop + 15, 10, 1);
  }

  // dirt, then nothing but black below it (like the original's bottom bar)
  const depth = Math.max(78, Math.round(view.h * 0.2));
  rect(ctx, '#946a20', 0, back, view.w, depth); rect(ctx, '#a57a30', 0, back, view.w, 1);
  for (const r of rocks) {
    const x = cx + r.x, y = gy + Math.round(r.y * depth / 78);
    if (x < -8 || x > view.w + 8) continue;
    for (let k = 0; k < r.s; k++) rect(ctx, '#5c4526', x - k, y + k, k * 2 + 1, 1);
    rect(ctx, '#b08d5c', x, y, 1, 1);
  }
  rect(ctx, '#5a4428', 0, back + depth, view.w, 14);
  if (back + depth + 14 < view.h) rect(ctx, '#0a0a0a', 0, back + depth + 14, view.w, view.h - back - depth - 14);

  // concrete slab, drawn in the original's slight top-down perspective
  for (let r = 0; r < 12; r++) { const half = Math.round(S - 6 + r * 10 / 11); rect(ctx, shade('#abb893', -r * 3), cx - half, back + r, half * 2, 1); }
  rect(ctx, '#5d5d52', cx - S - 4, gy + 6, 2 * (S + 4), 6);
  rect(ctx, '#29201a', cx - S - 4, gy + 12, 2 * (S + 4), 1);

  cone(cx - S - 16, back + 1); cone(cx + S + 18, back + 1);
}
// Each floor sits on the bent line: its bottom is moved sideways by the bend at its height and
// it leans by the bend's slope across its own height. The bottom three floors stay put.
function drawTower(g, camY) {
  const n = g.tower.length;
  if (!n) return;
  const cx = view.w / 2;
  const iMin = Math.max(0, Math.floor(-(camY + view.h) / H) - 2), iMax = Math.min(n - 1, Math.ceil(-camY / H) + 2);
  for (let i = iMin; i <= iMax; i++) {
    const f = g.tower[i], d0 = bendAt(g, i), d1 = bendAt(g, i + 1);
    const lean = Math.atan2(d1 - d0, H) + (i === n - 1 ? wobbleAngle(g) : 0);
    const bx = Math.round(cx + f.x + d0), by = Math.round(-i * H - camY);
    if (Math.abs(lean) < 0.004) { ctx.drawImage(SPR[f.kind], bx - W / 2, by - H); continue; }
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(lean);
    ctx.drawImage(SPR[f.kind], -W / 2, -H);
    ctx.restore();
  }
}
function drawBlock(kind, x, y, ang) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (ang) ctx.rotate(ang);
  ctx.drawImage(SPR[kind], -W / 2, -H / 2);
  ctx.restore();
}
// The rope ends in a round pulley with a gold hub; a short hook under it carries the floor,
// whose top edge sits 11 px below the rope end (27 px in the recording).
function drawRigging(kind, loaded) {
  const O = '#1e1a14', G = '#8e8e86', L = '#c4c4bc';
  rect(ctx, O, -2, 0, 5, 1); rect(ctx, O, -3, 1, 7, 6); rect(ctx, O, -2, 7, 5, 1);   // pulley outline
  rect(ctx, G, -2, 1, 5, 6); rect(ctx, L, -2, 1, 2, 1); rect(ctx, L, -2, 2, 1, 1);
  rect(ctx, '#f2c83a', -1, 3, 3, 2); rect(ctx, '#fff0a0', -1, 3, 1, 1);           // gold hub
  if (kind === 'foundation' && loaded) {             // two-cable sling for the first floor
    pixLine(ctx, '#1a1a1a', 0, 8, -(W / 2 - 4), HANG.foundation);
    pixLine(ctx, '#1a1a1a', 0, 8, W / 2 - 4, HANG.foundation);
  } else {                                           // hook shank down to the floor's top
    rect(ctx, O, -1, 8, 3, HANG.floor - 8);
    rect(ctx, '#b88a4a', 0, 8, 1, HANG.floor - 8);
    if (!loaded) { rect(ctx, O, -2, HANG.floor - 1, 1, 2); rect(ctx, O, -2, HANG.floor + 1, 4, 1); }   // open hook
  }
}
function drawCrane(g) {
  const h = hookAt(g), cx = view.w / 2;
  const hx = Math.round(h.x), hy = Math.round(h.y), py = RIG.pivotY;
  // rope from the pivot above the screen, drawn from the top edge down
  const k0 = (Math.max(py, -2) - py) / Math.max(1, hy - py);
  pixLine(ctx, '#050505', Math.round(cx + (hx - cx) * k0) - 1, Math.max(py, -2), hx - 1, hy, 3);
  const kind = nextKind(g);
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(h.tilt);
  drawRigging(kind, g.hook.has);
  if (g.hook.has) ctx.drawImage(SPR[kind], -W / 2, HANG[kind]);
  ctx.restore();
}
function render() {
  const g = game;
  ctx.setTransform(view.m, 0, 0, view.m, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const camY = Math.round(g.camY);
  const alt = Math.max(0, -camY - view.h / 2);
  drawSky(alt);
  drawStars(alt, camY);
  drawSpace(alt, camY);
  drawClouds(alt, camY);
  drawBackdrop(FAR, camY, 0.35);
  drawBackdrop(NEAR, camY, CFG.parallax);
  drawGround(camY);
  drawTower(g, camY);
  const cx = view.w / 2;
  for (const d of g.debris) {
    if (d.state === 'wreck' && Math.floor(d.t * 10) % 2) continue;
    drawBlock(d.kind, cx + d.x, d.y - camY, d.ang);
  }
  if (g.falling) drawBlock(g.falling.kind, cx + g.falling.x, g.falling.y - camY, g.falling.ang);
  for (const p of g.parts) {
    ctx.globalAlpha = 1 - p.t / p.life;
    rect(ctx, p.c, Math.round(cx + p.x), Math.round(p.y - camY), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const k of g.twinkles) {
    if (!g.tower[k.floor] || Math.floor(k.t * 20) % 3 === 2) continue;
    const p = bent(g, k.lx, k.ly);
    drawTwinkle(Math.round(cx + p.x), Math.round(p.y - camY), k.big);
  }
  for (const p of g.tenants) {
    if (p.t < 0) continue;
    const pos = tenantPos(g, p);
    drawTenant(p, Math.round(cx + pos.x), Math.round(pos.y - camY));
  }
  for (const b of g.bursts) {
    const k = b.t / b.life, d = b.dist * easeOut(Math.min(1, k * 1.25));
    const x0 = cx + b.x0, y0 = b.y0 - camY, x = x0 + b.dx * d, y = y0 + b.dy * d;
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    pixLine(ctx, '#fff2a0', Math.round(x0), Math.round(y0), Math.round(x), Math.round(y));
    drawStar(Math.round(x), Math.round(y));
  }
  ctx.globalAlpha = 1;
  drawCrane(g);
}

/* ---------------- HUD ---------------- */
$('lives').innerHTML = '<i class="life"></i>'.repeat(CFG.lives);
function updateHud() {
  const g = game, n = g.tower.length, goal = (Math.floor(n / 10) + 1) * 10;
  $('gaugeBadge').textContent = goal;                       // the next ten floors, like the original's target gauge
  $('gaugeFill').style.height = `calc(${(n % 10) * 10}% - 2px)`;
  $('gauge').setAttribute('aria-label', `${n} ${n === 1 ? 'floor' : 'floors'}`);
  $('hudPop').textContent = pad(g.pop, 5);
  $('lives').setAttribute('aria-label', `${g.lives} of ${CFG.lives} lives left`);
  [...$('lives').children].forEach((el, i) => el.classList.toggle('lost', i >= g.lives));
}
let lastComboText = '';
function updateCombo() {
  const c = game && game.combo, on = !!(c && c.n > 0 && state === 'play');
  $('combo').hidden = !on;
  $('bonus').hidden = !(game && game.bonusT > 0);
  if (!on) return;
  $('comboFill').style.width = (clamp(c.left, 0, 1) * 100).toFixed(1) + '%';
  const text = c.n >= 2 ? `x${c.n}` : '';
  if (text !== lastComboText) { $('comboLabel').textContent = text; lastComboText = text; }
}

/* ---------------- Rounds ---------------- */
function startRound() {
  game = newGame();
  state = 'play';
  $('result').hidden = true;
  hud.hidden = false;
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  updateHud();
}

function finishRound(g) {
  if (g.finished) return;
  g.finished = true;
  const n = g.tower.length;
  const bestF = n > save.best.floors, bestP = g.pop > save.best.pop;
  if (bestF) save.best.floors = n;
  if (bestP) save.best.pop = g.pop;
  persist();
  $('resTitle').textContent = `${n} ${n === 1 ? 'floor' : 'floors'}`;
  const stats = [
    ['Residents', fmt(g.pop)],
    ['Perfect drops', g.perfects],
    ['Longest combo', g.maxCombo > 1 ? `x${g.maxCombo}` : 'none'],
    ['Best tower', `${save.best.floors} ${save.best.floors === 1 ? 'floor' : 'floors'}`],
  ];
  $('resStats').innerHTML = '';
  for (const [k, v] of stats) {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v;
    $('resStats').append(dt, dd);
  }
  $('resNote').textContent = bestF ? 'New tallest tower.' : bestP ? 'New population record.' : '';
  state = 'result';
  hud.hidden = true;
  $('result').hidden = false;
  $('btnAgain').focus({ preventScroll: true });
}

/* ---------------- Input ---------------- */
function tapAction() {
  Sound.ensure();
  if (state !== 'play' || !game) return;
  if (game.pan) { game.camY = game.pan.to; return; }
  drop();
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button, .screen')) return;
  if (e.button > 0) return;
  e.preventDefault();
  tapAction();
});
window.addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); if (!e.repeat) tapAction(); }
});
$('btnAgain').addEventListener('click', () => { Sound.ensure(); startRound(); });
function setMuted(m) {
  save.muted = m; Sound.muted = m;
  $('soundBtn').setAttribute('aria-pressed', String(m));
  $('soundBtn').setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
}
$('soundBtn').addEventListener('click', () => { setMuted(!save.muted); persist(); Sound.ensure(); });
window.addEventListener('resize', () => {
  layout();
  if (!game) return;
  if (state !== 'play') game.camY = endCam();
  else if (!game.pan) { game.cam = null; game.camY = cameraTarget(game); }
});

/* ---------------- Loop ---------------- */
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  sceneTime += dt;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  updateCombo();
  render();
  requestAnimationFrame(frame);
}

load();
setMuted(save.muted);
layout();
startRound();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
